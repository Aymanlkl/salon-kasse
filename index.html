<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Salon Kasse</title>
<meta name="description" content="Tageskasse für den Friseursalon: Kunden mit Bar oder Karte erfassen, Umsatz pro Friseur, Tagesabschluss und Gehalt.">
<meta name="theme-color" content="#EEF1EE">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salon Kasse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ============================================================
   Salon Kasse — Design tokens
   Palette: enamel green-grey ground, brass accent (clippers,
   mirror fittings), slate-blue for card payments, forest green
   for paid, brick for open.
   Type: Archivo variable (wdth 62–125) used across widths —
   expanded for money figures, narrow uppercase for labels;
   Instrument Serif for the wordmark only.
   ============================================================ */
:root{
  color-scheme:light;
  --ground:#EEF1EE;
  --surface:#FFFFFF;
  --surface-2:#F5F7F4;
  --ink:#131C1A;
  --ink-2:#4C5A56;
  --ink-3:#7E8C87;
  --line:#E1E5E1;
  --line-2:#CFD5D0;
  --brass:#8A6116;
  --on-brass:#FFFFFF;
  --brass-soft:#F3E8D2;
  --bar:#8A6116;
  --bar-soft:#F3E8D2;
  --card:#2B5B71;
  --card-soft:#DEEAF0;
  --pos:#1E6B4A;
  --pos-soft:#DBEDE3;
  --open:#A5401E;
  --open-soft:#F7E1D9;
  --scrim:rgba(10,16,15,.42);
  --shadow:0 1px 2px rgba(19,28,26,.05), 0 10px 30px -16px rgba(19,28,26,.30);
  --shadow-sheet:0 -8px 40px -12px rgba(10,16,15,.28);
  --r:16px;
  --r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
#app{
  position:fixed;inset:0;margin:0 auto;max-width:480px;width:100%;
  display:grid;grid-template-rows:auto 1fr auto;
  background:var(--ground);overflow:hidden;
}
@media (min-width:520px){
  body{background:var(--surface-2)}
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- top bar ---------- */
#topbar{
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:var(--ground);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.tb-title{font-size:19px;font-weight:700;font-stretch:104%;letter-spacing:-.01em;line-height:1.15}
.tb-sub{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px}
.tb-grow{flex:1;min-width:0}
.daynav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.daynav button{width:32px;height:30px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2)}
.daynav button:active{background:var(--surface-2)}
.daynav .today{width:auto;padding:0 11px;font-size:12px;font-weight:600;font-stretch:90%;letter-spacing:.02em;color:var(--brass)}
.iconbtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.iconbtn:active{background:var(--surface-2)}

/* ---------- scroll region ---------- */
#view{
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px 118px;
  display:flex;flex-direction:column;gap:14px;
}

/* ---------- type utilities ---------- */
.eyebrow{
  font-size:10.5px;font-weight:600;font-stretch:86%;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.money{font-variant-numeric:tabular-nums;font-stretch:112%;letter-spacing:-.015em}
.hero-fig{font-size:clamp(33px,9.6vw,41px);font-weight:700;line-height:1.05}
.num{font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sec-act{font-size:12.5px;font-weight:600;color:var(--brass)}

/* hero */
.hero{padding:16px 16px 14px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hero-fig{margin:6px 0 0}
.hero-meta{margin-top:3px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.split{display:flex;gap:8px;margin-top:14px}
.split .chip{flex:1}
.chip{
  display:flex;flex-direction:column;gap:1px;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
}
.chip .k{font-size:10.5px;font-weight:600;font-stretch:86%;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.chip .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%}
.chip.bar{background:var(--bar-soft);border-color:transparent}
.chip.bar .k,.chip.bar .v{color:var(--bar)}
.chip.karte{background:var(--card-soft);border-color:transparent}
.chip.karte .k,.chip.karte .v{color:var(--card)}

/* stacked payment bar */
.pbar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:12px}
.pbar i{display:block;height:100%}
.pbar i.b{background:var(--bar)}
.pbar i.k{background:var(--card)}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:11px;padding:12px 15px;
  border-top:1px solid var(--line);text-align:left;width:100%;
}
.rows .row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row .lead{width:44px;flex:none;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.row .main{flex:1;min-width:0}
.row .main>span{display:block}
.row .t1{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--ink-3);margin-top:1px}
.row .amt{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%;white-space:nowrap}
.pay-dot{width:9px;height:9px;border-radius:99px;flex:none}
.pay-dot.b{background:var(--bar)}
.pay-dot.k{background:var(--card)}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:600;font-stretch:92%;letter-spacing:.02em;white-space:nowrap;
}
.pill.paid{background:var(--pos-soft);color:var(--pos)}
.pill.open{background:var(--open-soft);color:var(--open)}
.pill.me{background:var(--brass-soft);color:var(--brass)}
.pill.neutral{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.closed{background:var(--pos-soft);color:var(--pos)}

/* segmented */
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;font-stretch:96%;
  color:var(--ink-2);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.10)}

/* barber chips */
.bchips{display:flex;gap:7px;overflow-x:auto;padding:1px 4px 3px;scrollbar-width:none}
.bchips::-webkit-scrollbar{display:none}
.bchip{
  padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;font-stretch:96%;color:var(--ink-2);white-space:nowrap;flex:none;
}
.bchip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:14px;font-size:15px;font-weight:600;font-stretch:100%;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink);
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brass);color:var(--on-brass);border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--open);border-color:var(--open-soft);background:var(--open-soft)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}

/* FAB dock */
#fab{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);
  padding:0 14px 12px;pointer-events:none;
  background:linear-gradient(to top,var(--ground) 42%,transparent);
}
#fab .btn{pointer-events:auto;box-shadow:var(--shadow)}

/* tab bar */
#tabbar{
  display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:var(--ink-3);
}
#tabbar button .lbl{font-size:10px;font-weight:600;font-stretch:90%;letter-spacing:.02em}
#tabbar button[aria-current="page"]{color:var(--brass)}
#tabbar svg{width:22px;height:22px}

/* empty */
.empty{padding:34px 20px;text-align:center;color:var(--ink-3)}
.empty .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.empty .sm{font-size:13px;line-height:1.5}

/* bars in report */
.brow{padding:12px 15px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brow .nm{font-size:14.5px;font-weight:600}
.brow .vl{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%}
.brow .l2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.track i{display:block;height:100%;background:var(--brass);border-radius:99px}

/* key-value list */
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:14px;color:var(--ink-2)}
.kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%}
.kv.total{background:var(--surface-2)}
.kv.total .k{color:var(--ink);font-weight:600}
.kv.total .v{font-size:17px}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s ease}
.sheet-wrap.in .scrim{opacity:1}
.sheet{
  position:relative;width:100%;max-width:480px;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-sheet);
  padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;
}
.sheet-wrap.in .sheet{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:2px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-title{font-size:17px;font-weight:700;font-stretch:104%;letter-spacing:-.01em}
.sheet-x{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}

/* amount display */
.amt-display{
  display:flex;align-items:baseline;justify-content:center;gap:6px;
  padding:12px 0 14px;
}
.amt-display .n{
  font-size:clamp(40px,12vw,48px);font-weight:700;font-stretch:115%;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
}
.amt-display .n.zero{color:var(--ink-3)}
.amt-display .cur{font-size:22px;font-weight:600;color:var(--ink-3)}
.caret{display:inline-block;width:2px;height:.82em;background:var(--brass);margin-left:2px;border-radius:2px;animation:blink 1.1s steps(1) infinite;vertical-align:baseline}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

.quick{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{
  padding:8px 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none;
}
.quick button:active{background:var(--brass-soft);color:var(--brass)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{
  height:54px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;transition:transform .06s ease,background .12s ease;
}
.pad button:active{transform:scale(.95);background:var(--brass-soft);color:var(--brass)}
.pad button.util{font-size:19px;color:var(--ink-2)}

.pay2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.pay-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:15px 8px;border-radius:15px;
  font-size:15px;font-weight:700;font-stretch:102%;border:1px solid transparent;
}
.pay-btn .sub{font-size:10.5px;font-weight:600;font-stretch:88%;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.pay-btn.b{background:var(--bar);color:var(--on-brass)}
.pay-btn.k{background:var(--card);color:#fff}
.pay-btn:active{transform:scale(.98)}
.pay-btn[disabled]{opacity:.4}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;font-stretch:86%;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field textarea,.field select{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--ink);font-size:15.5px;font-family:inherit;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brass);background:var(--surface)}
.hintline{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.linkbtn{font-size:13px;font-weight:600;color:var(--brass);padding:6px 0}

.toast{
  position:fixed;left:50%;transform:translate(-50%,14px);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;
  font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.22s ease;pointer-events:none;
  max-width:88vw;text-align:center;
}
.toast.in{opacity:1;transform:translate(-50%,0)}

.wordmark{font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1;letter-spacing:-.01em}
.wordmark em{font-style:italic;color:var(--brass)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="view"></main>
  <div id="fab"></div>
  <nav id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>

<script>

"use strict";

/* ============================================================
   Storage
   ============================================================ */
const KEY = 'salonkasse.v1';
const EMBEDDED = (()=>{ try{ return window.top !== window.self; }catch(e){ return true; } })();
const APP_VERSION = '1.0';
const uid = () => Math.random().toString(36).slice(2,10);

function defaultState(){
  return {
    v:1,
    settings:{ shop:'', onboarded:false },
    barbers:[ {id:'b1', name:'Ich', me:true} ],
    entries:[],   // {id,d,t,b,a,p,n}
    expenses:[],  // {id,d,a,c,n}
    payouts:[],   // {id,d,b,a,s,src}
    closes:{}     // {'YYYY-MM-DD':true}
  };
}
let S;
try{
  const raw = localStorage.getItem(KEY);
  S = raw ? JSON.parse(raw) : null;
}catch(e){ S = null; }

// Daten aus einer älteren Version: als eingerichtet behandeln
if(S && S.settings && S.settings.onboarded === undefined)
  S.settings.onboarded = Array.isArray(S.entries) && S.entries.length > 0;

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ============================================================
   Date + money helpers
   ============================================================ */
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WD_S = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const pad2 = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromISO = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
const todayISO = () => iso(new Date());
const addDays = (s,n) => { const d=fromISO(s); d.setDate(d.getDate()+n); return iso(d); };

const eurFmt = new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = c => eurFmt.format((c||0)/100) + ' €';
const eur0 = c => new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}).format(Math.round((c||0)/100)) + ' €';

function dateLabel(s){
  const d = fromISO(s);
  return `${WD[d.getDay()]}, ${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;
}
function dateShort(s){
  const d = fromISO(s);
  return `${WD_S[d.getDay()]} ${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.`;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function isoWeek(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 4 - (t.getDay()||7));
  const y0 = new Date(t.getFullYear(),0,1);
  return { week: Math.ceil((((t-y0)/86400000)+1)/7), year: t.getFullYear() };
}
function weekStart(s){
  const d = fromISO(s); const off = (d.getDay()+6)%7;
  d.setDate(d.getDate()-off); return iso(d);
}

/* ============================================================
   Demo data (deterministic)
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedDemo(st){
  const rnd = mulberry32(20260829);
  const services = [
    ['Herrenschnitt',2200,2800],['Schnitt + Bart',3200,3800],['Bart',1200,1600],
    ['Kinderschnitt',1500,1800],['Färben',5500,9000],['Waschen + Schnitt',2600,3200],
    ['Maschinenschnitt',1500,1800],['Rasur',2000,2500]
  ];
  const names = ['Ali','Mehmet','Herr Weber','Yannick','Sami','Herr Klein','Deniz','Jonas','Herr Braun','Emre','Luca','Herr Schmidt'];
  const start = 44;
  for(let k=start;k>=0;k--){
    const d = addDays(todayISO(), -k);
    const dow = fromISO(d).getDay();
    if(dow===0) continue;                       // Sonntag zu
    if(dow===1 && rnd()<0.55) continue;         // manchmal Montag zu
    st.barbers.forEach((b,bi)=>{
      if(bi===2 && rnd()<0.62) return;          // Karim nur manchmal
      const n = 5 + Math.floor(rnd()* (bi===0?9:7));
      for(let i=0;i<n;i++){
        const sv = services[Math.floor(rnd()*services.length)];
        const a = Math.round((sv[1] + rnd()*(sv[2]-sv[1]))/50)*50;
        const hh = 9 + Math.floor(rnd()*10), mm = Math.floor(rnd()*12)*5;
        st.entries.push({
          id:uid(), d, t:`${pad2(hh)}:${pad2(mm)}`, b:b.id, a,
          p: rnd()<0.46?'bar':'karte',
          n: rnd()<0.5 ? sv[0] : (rnd()<0.5 ? names[Math.floor(rnd()*names.length)] : '')
        });
      }
    });
    if(rnd()<0.28){
      const cats=['Material','Sonstiges','Miete'];
      const c = cats[Math.floor(rnd()*cats.length)];
      st.expenses.push({id:uid(), d, a: c==='Miete'?95000:Math.round((1500+rnd()*12000)/100)*100, c, n: c==='Material'?'Farbe & Pflege':''});
    }
    // Tagesabschluss für vergangene Tage
    if(k>0){
      st.closes[d]=true;
      st.barbers.forEach((b,bi)=>{
        const rev = st.entries.filter(e=>e.d===d && e.b===b.id).reduce((s,e)=>s+e.a,0);
        if(!rev) return;
        const amt = Math.round(rev*(bi===0?0.42:0.45)/500)*500;
        st.payouts.push({id:uid(), d, b:b.id, a:amt, s: (k>6 ? 'paid' : (rnd()<0.55?'paid':'open')), src:'close'});
      });
    }
  }
  save();
}

let toastT;
function toast(msg){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;

}

/* ---------- amount buffer ---------- */
function makeAmount(initialCents){
  let buf = '';
  if(initialCents){
    const s = (initialCents/100).toFixed(2).replace('.',',');
    buf = s.endsWith(',00') ? s.slice(0,-3) : s;
  }
  return {
    get raw(){ return buf; },
    get cents(){
      if(!buf) return 0;
      return Math.round(parseFloat(buf.replace(',','.'))*100) || 0;
    },
    press(k){
      if(k==='del'){ buf = buf.slice(0,-1); return; }
      if(k===','){ if(buf.includes(',')) return; buf = buf===''? '0,' : buf+','; return; }
      if(buf.includes(',')){ if(buf.split(',')[1].length>=2) return; }
      else if(buf.replace('-','').length>=6) return;
      if(buf==='0' && k!=='0') buf = k; else if(buf==='0' && k==='0') return; else buf += k;
    },
    set(cents){ const s=(cents/100).toFixed(2).replace('.',','); buf = s.endsWith(',00')? s.slice(0,-3):s; },
    display(){
      if(!buf) return '<span class="n zero">0<span class="caret"></span></span><span class="cur">€</span>';
      const [i,d] = buf.split(',');
      const gi = new Intl.NumberFormat('de-DE').format(parseInt(i||'0',10));
      return `<span class="n">${gi}${buf.includes(',')?','+esc(d||''):''}<span class="caret"></span></span><span class="cur">€</span>`;
    }
  };
}
function padHTML(){
  const keys = ['1','2','3','4','5','6','7','8','9',',','0','del'];
  return `<div class="pad">${keys.map(k=>
    `<button data-k="${k}" class="${k===','||k==='del'?'util':''}" aria-label="${k==='del'?'Löschen':k}">${k==='del'?'⌫':k}</button>`
  ).join('')}</div>`;
}
function quickAmounts(){
  const freq = {};
  S.entries.slice(-400).forEach(e=>{ freq[e.a] = (freq[e.a]||0)+1; });
  const top = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,5).map(Number).sort((a,b)=>a-b);
  return top.length>=3 ? top : [1500,2000,2500,3000,3500];
}

      const nt = extra.querySelector('#nt'); if(nt) nt.oninput = ()=> note = nt.value;
    };

      : `<button class="btn primary block" data-dl>Als Datei speichern</button>
         <button class="btn ghost block" data-copy style="margin-top:10px">Text kopieren</button>`}
  `;
  openSheet(title, body, {onMount(root){
    root.querySelector('[data-copy]').onclick = async ()=>{
      try{ await navigator.clipboard.writeText(text); toast('Kopiert'); }

    root.querySelector('[data-dl]').onclick = ()=>{
      try{

        document.body.appendChild(a); a.click(); a.remove();
        toast('Datei gespeichert');
      }catch(e){ toast('Download hier blockiert – Text kopieren'); }
    };

    <div class="split">

function entryRows(list, showBarber){
  if(!list.length) return `<div class="card"><div class="empty"><div class="big">Noch keine Einträge</div><div class="sm">Tippe unten auf „Kunde“ und gib den Betrag ein.</div></div></div>`;
  return `<section class="card"><div class="rows">${list.map(e=>`
    <button class="row" data-entry="${e.id}">
      <span class="lead">${e.t}</span>
      <span class="main">
        <span class="t1">${esc(e.n || 'Kunde')}</span>
        <span class="t2">${showBarber?esc(bname(e.b))+' · ':''}${e.p==='bar'?'Bar':'Karte'}</span>

function screenHeute(){
  const list = entriesOn(ui.date).filter(e=> e.b===me().id);

  const closed = S.closes[ui.date];
  return heroCard(`Umsatz ${dateShort(ui.date)}`, t, closed?'<span class="pill closed">abgeschlossen</span>':'')

function screenTeam(){

    <div class="bchips">

      <div class="brow">

        <div class="track"><i style="width:${(x.tt.total/max*100).toFixed(1)}%"></i></div>

function screenKasse(){

  const dayEntries = S.entries.filter(e=>e.d===d);

  const perB = S.barbers.map(b=>({b, t: totals(dayEntries.filter(e=>e.b===b.id))}))
                        .filter(x=> x.t.count>0 || x.b.me);

  const payRows = S.barbers.map(b=>{
    const p = S.payouts.find(x=>x.d===d && x.b===b.id && x.src==='close');
    const rev = totals(dayEntries.filter(e=>e.b===b.id)).total;
    if(!p && !rev && !b.me) return '';
    return `<button class="row" data-sal="${b.id}">
      <span class="main">
        <span class="t1">${esc(b.name)}${b.me?' <span class="pill me">ich</span>':''}</span>
        <span class="t2">${p ? (p.s==='paid'?'ausgezahlt':'noch offen') : 'noch nicht eingetragen'}</span>

      ${p?`<span class="pill ${p.s==='paid'?'paid':'open'}">${p.s==='paid'?'bezahlt':'offen'}</span>`:''}
      <span class="amt money">${p?eur(p.a):'—'}</span>
    </button>`;
  }).join('');

  return `
    ${heroCard(`Gesamtumsatz ${dateShort(d)}`, tAll, closed?'<span class="pill closed">abgeschlossen</span>':'')}

    <div class="sec-head"><span class="eyebrow">Umsatz nach Friseur</span></div>
    <section class="card">${perB.map(x=>`
      <div class="kv"><span class="k">${esc(x.b.name)}${x.b.me?' · ich':''} <span style="color:var(--ink-3);font-size:12px">(${x.t.count})</span></span><span class="v">${eur(x.t.total)}</span></div>
    `).join('')}
      <div class="kv total"><span class="k">Umsatz gesamt</span><span class="v">${eur(tAll.total)}</span></div>
    </section>

    <div class="sec-head"><span class="eyebrow">Ausgaben</span><button class="sec-act" data-addexp>+ Ausgabe</button></div>
    <section class="card">
      ${exp.length? exp.map(x=>`<button class="row" data-exp="${x.id}">
        <span class="main"><span class="t1">${esc(x.c)}</span>${x.n?`<span class="t2">${esc(x.n)}</span>`:''}</span>
        <span class="amt money" style="color:var(--open)">− ${eur(x.a)}</span></button>`).join('')
        : `<div class="empty" style="padding:20px"><div class="sm">Heute keine Ausgaben</div></div>`}
      <div class="kv total"><span class="k">Tagesergebnis</span><span class="v">${eur(tAll.total-expSum)}</span></div>
    </section>

    <div class="sec-head"><span class="eyebrow">Gehalt heute</span><span class="eyebrow">tippen zum Eintragen</span></div>
    <section class="card"><div class="rows">${payRows || '<div class="empty" style="padding:20px"><div class="sm">Keine Friseure aktiv</div></div>'}</div></section>

    <div class="card card-pad" style="background:var(--surface-2);box-shadow:none">
      <div class="eyebrow" style="margin-bottom:6px">In der Kasse</div>
      <div class="hintline">Bar eingenommen <strong class="num">${eur(tAll.bar)}</strong> · bar ausgezahltes Gehalt <strong class="num">${eur(sum(S.payouts.filter(p=>p.d===d&&p.s==='paid'),p=>p.a))}</strong> · Ausgaben <strong class="num">${eur(expSum)}</strong><br>
      Rechnerischer Bar-Bestand: <strong class="num" style="color:var(--ink)">${eur(tAll.bar - sum(S.payouts.filter(p=>p.d===d&&p.s==='paid'),p=>p.a) - expSum)}</strong></div>

function periodLabel(){
  const r = rangeOf(ui.range, ui.anchor);
  if(ui.range==='tag') return dateLabel(ui.anchor);
  if(ui.range==='woche'){ const w=isoWeek(fromISO(ui.anchor)); return `KW ${w.week} · ${dateShort(r[0]).slice(3)}–${dateShort(r[1]).slice(3)}`; }
  if(ui.range==='monat'){ const d=fromISO(ui.anchor); return `${MON[d.getMonth()]} ${d.getFullYear()}`; }
  return `Jahr ${fromISO(ui.anchor).getFullYear()}`;
}
function shiftPeriod(n){
  const d = fromISO(ui.anchor);
  if(ui.range==='tag') d.setDate(d.getDate()+n);
  else if(ui.range==='woche') d.setDate(d.getDate()+7*n);
  else if(ui.range==='monat') d.setMonth(d.getMonth()+n);
  else d.setFullYear(d.getFullYear()+n);
  ui.anchor = iso(d);
}

function screenBericht(){
  const r = rangeOf(ui.range, ui.anchor);

  const pays = S.payouts.filter(p=>inRange(p.d,r));

    return `<div class="brow">
      <div class="l1"><span class="nm">${esc(b.name)}${b.me?' <span class="pill me">ich</span>':''}</span><span class="vl">${eur(pd+op)}</span></div>

        <span class="pill paid">${I.check} ${eur(pd)} bezahlt</span>
        ${op?`<span class="pill open">${eur(op)} offen</span>`:'<span style="font-size:11.5px">nichts offen im Zeitraum</span>'}
      </div>

    </div>`;
  }).join('');

  const w = t.total||1;
  return `
    <div class="seg" id="rangeseg">
      ${['tag','woche','monat','jahr'].map(k=>`<button data-r="${k}" aria-pressed="${ui.range===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}
    </div>

    <section class="card hero">
      <div class="eyebrow">Umsatz · ${esc(periodLabel())}</div>
      <div class="hero-fig money">${eur(t.total)}</div>
      <div class="hero-meta">${t.count} Kunden${t.count?` · ø ${eur(Math.round(t.total/t.count))}`:''}</div>
      <div class="pbar"><i class="b" style="width:${(t.bar/w*100).toFixed(1)}%"></i><i class="k" style="width:${(t.karte/w*100).toFixed(1)}%"></i></div>
      <div class="split">
        <div class="chip bar"><span class="k">Bar ${Math.round(t.bar/w*100)} %</span><span class="v">${eur(t.bar)}</span></div>
        <div class="chip karte"><span class="k">Karte ${Math.round(t.karte/w*100)} %</span><span class="v">${eur(t.karte)}</span></div>
      </div>
    </section>

    <section class="card">
      <div class="kv"><span class="k">Umsatz</span><span class="v">${eur(t.total)}</span></div>
      <div class="kv"><span class="k">Ausgaben (${exp.length})</span><span class="v" style="color:var(--open)">− ${eur(expSum)}</span></div>
      <div class="kv"><span class="k">Gehalt ausgezahlt</span><span class="v" style="color:var(--open)">− ${eur(paid)}</span></div>
      <div class="kv total"><span class="k">Verbleibt</span><span class="v">${eur(t.total-expSum-paid)}</span></div>
    </section>

    <div class="sec-head"><span class="eyebrow">Umsatz pro Friseur</span></div>
    <section class="card">${perB.length? perB.map(x=>`
      <div class="brow">
        <div class="l1"><span class="nm">${esc(x.b.name)}${x.b.me?' <span class="pill me">ich</span>':''}</span><span class="vl">${eur(x.t.total)}</span></div>
        <div class="track"><i style="width:${(x.t.total/max*100).toFixed(1)}%"></i></div>
        <div class="l2"><span>${Math.round(x.t.total/w*100)} % · ${x.t.count} Kunden</span><span>ø ${eur(Math.round(x.t.total/(x.t.count||1)))}</span></div>
      </div>`).join('') : '<div class="empty"><div class="sm">Keine Umsätze in diesem Zeitraum</div></div>'}
    </section>

    <div class="sec-head"><span class="eyebrow">Gehalt: bezahlt / offen</span></div>
    <section class="card">${salRows || '<div class="empty"><div class="sm">Keine Gehaltseinträge</div></div>'}</section>
    ${openAll?`<div class="card card-pad" style="background:var(--open-soft);border-color:transparent;box-shadow:none">
      <div class="eyebrow" style="color:var(--open)">Offen gesamt</div>
      <div class="money" style="font-size:26px;font-weight:700;color:var(--open);margin-top:2px">${eur(openAll)}</div>
      <div class="hintline" style="color:var(--open);opacity:.85">Noch nicht ausgezahltes Gehalt über alle Tage</div>

}

/* ============================================================
   Render
   ============================================================ */
const TABS = [
  {k:'heute', l:'Heute', i:I.scissors},
  {k:'team', l:'Team', i:I.team},
  {k:'kasse', l:'Kasse', i:I.cash},
  {k:'bericht', l:'Bericht', i:I.chart},
  {k:'mehr', l:'Mehr', i:I.more}
];

function render(){
  renderTopbar();
  const v = document.getElementById('view');
  const scroll = v.scrollTop;
  v.innerHTML =
    ui.tab==='heute' ? screenHeute() :
    ui.tab==='team' ? screenTeam() :
    ui.tab==='kasse' ? screenKasse() :
    ui.tab==='bericht' ? screenBericht() : screenMehr();
  v.scrollTop = 0;
  bindView(v);
  renderFab();
  renderTabs();
}

function renderTabs(){
  const tb = document.getElementById('tabbar');
  tb.innerHTML = TABS.map(t=>`
    <button data-tab="${t.k}" ${ui.tab===t.k?'aria-current="page"':''}>
      ${t.i}<span class="lbl">${t.l}</span>
    </button>`).join('');
  tb.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=>{ ui.tab=b.dataset.tab; buzz(6); render(); });
}

function renderFab(){
  const f = document.getElementById('fab');
  if(ui.tab==='heute' || ui.tab==='team'){
    f.innerHTML = `<button class="btn primary block" data-add>${I.plus} Kunde</button>`;
    f.querySelector('[data-add]').onclick = ()=>{
      if(ui.tab==='team'){
        const def = ui.teamFilter!=='all' ? ui.teamFilter : (others()[0]||me()).id;
        sheetEntry(null, def, true);
      } else sheetEntry(null, me().id, false);
    };
  } else if(ui.tab==='kasse'){
    const closed = !!S.closes[ui.date];
    f.innerHTML = `<button class="btn ${closed?'ghost':'primary'} block" data-close2>${closed?'Tag wieder öffnen':'Tag abschließen'}</button>`;
    f.querySelector('[data-close2]').onclick = ()=>{
      if(closed){ delete S.closes[ui.date]; save(); render(); toast('Tag wieder geöffnet'); return; }
      confirmClose();
    };
  } else if(ui.tab==='bericht'){
    f.innerHTML = `<button class="btn block" data-exp2>Zeitraum exportieren</button>`;
    f.querySelector('[data-exp2]').onclick = ()=> exportCSV(rangeOf(ui.range, ui.anchor));
  } else {
    f.innerHTML = '';
  }
}

function bindView(v){
  v.querySelectorAll('[data-entry]').forEach(b=> b.onclick = ()=>{
    const e = S.entries.find(x=>x.id===b.dataset.entry);
    if(e) sheetEntry(e, e.b, ui.tab==='team');
  });
  v.querySelectorAll('[data-tf]').forEach(b=> b.onclick = ()=>{ ui.teamFilter=b.dataset.tf; render(); });
  v.querySelectorAll('[data-r]').forEach(b=> b.onclick = ()=>{ ui.range=b.dataset.r; render(); });
  v.querySelectorAll('[data-sal]').forEach(b=> b.onclick = ()=> sheetSalary(b.dataset.sal, ui.date));
  v.querySelectorAll('[data-exp]').forEach(b=> b.onclick = ()=>{
    const x = S.expenses.find(y=>y.id===b.dataset.exp); if(x) sheetExpense(x);
  });
  const ae = v.querySelector('[data-addexp]'); if(ae) ae.onclick = ()=> sheetExpense(null);
  const ab = v.querySelector('[data-addbarber]'); if(ab) ab.onclick = ()=> sheetBarber(null);
  v.querySelectorAll('[data-barber]').forEach(b=> b.onclick = ()=>{
    const x = S.barbers.find(y=>y.id===b.dataset.barber); if(x) sheetBarber(x);
  });
  const ap = v.querySelector('[data-addpay]'); if(ap) ap.onclick = ()=> sheetManualPayout();
  v.querySelectorAll('[data-pay]').forEach(b=> b.onclick = ()=>{
    const p = S.payouts.find(x=>x.id===b.dataset.pay); if(p) sheetPayoutEdit(p);
  });
  const c = v.querySelector('[data-csv]'); if(c) c.onclick = ()=> exportCSV(null);
  const bk = v.querySelector('[data-backup]'); if(bk) bk.onclick = ()=>
    sheetText('Backup', `salon-backup-${todayISO()}.json`, JSON.stringify(S),
      'Sicherungsdatei mit allen Daten. Speichere sie regelmäßig – damit lässt sich alles wiederherstellen.');
  const rs = v.querySelector('[data-reset]'); if(rs) rs.onclick = ()=> confirmReset();
  const st = v.querySelector('[data-setup]'); if(st) st.onclick = ()=> sheetSetup(false);
  const rt = v.querySelector('[data-restore]'); if(rt) rt.onclick = ()=> restoreBackup();
  const dm = v.querySelector('[data-demo]'); if(dm) dm.onclick = ()=> loadDemo();
}

/* ---------- Friseur ---------- */
function sheetBarber(b){
  const isNew = !b;
  const body = `
    <div class="field"><label>Name</label><input type="text" id="nm" value="${b?esc(b.name):''}" placeholder="z. B. Yusuf" maxlength="24"></div>
    ${b&&b.me?'<p class="hintline">Das bist du. Deine Kunden erscheinen im Tab „Heute“.</p>':
      `<button class="btn ghost block" data-me style="margin-bottom:12px">Als „ich“ festlegen</button>`}
    <button class="btn primary block" data-save>${isNew?'Friseur hinzufügen':'Speichern'}</button>
    ${(!isNew && !b.me)?'<button class="btn danger block" data-del style="margin-top:10px">Friseur löschen</button>':''}
  `;
  openSheet(isNew?'Friseur hinzufügen':'Friseur bearbeiten', body, {onMount(root){
    const nm = root.querySelector('#nm'); setTimeout(()=>nm.focus(),260);
    const meBtn = root.querySelector('[data-me]');
    if(meBtn) meBtn.onclick = ()=>{
      if(isNew){ toast('Erst speichern'); return; }
      S.barbers.forEach(x=>x.me=false); b.me=true; save(); closeSheet(); render(); toast(`${b.name} ist jetzt „ich“`);
    };
    root.querySelector('[data-save]').onclick = ()=>{
      const n = nm.value.trim(); if(!n){ toast('Bitte Namen eingeben'); return; }
      if(isNew) S.barbers.push({id:uid(), name:n, me:S.barbers.length===0});
      else b.name = n;
      save(); closeSheet(); render(); toast('Gespeichert');
    };
    const del = root.querySelector('[data-del]');
    if(del) del.onclick = ()=>{
      const cnt = S.entries.filter(e=>e.b===b.id).length;
      openSheet('Friseur löschen?', `<p class="hintline">${esc(b.name)} hat ${cnt} Einträge. Die Einträge bleiben erhalten, der Friseur verschwindet aus den Listen.</p>
        <button class="btn danger block" data-yes style="margin-top:14px">Ja, löschen</button>
        <button class="btn ghost block" data-no style="margin-top:10px">Abbrechen</button>`,
        {onMount(r2){
          r2.querySelector('[data-yes]').onclick = ()=>{ S.barbers = S.barbers.filter(x=>x.id!==b.id); save(); closeSheet(); render(); toast('Gelöscht'); };
          r2.querySelector('[data-no]').onclick = ()=> closeSheet();
        }});
    };
  }});
}

/* ---------- manuelle Auszahlung / Auszahlung bearbeiten ---------- */
function sheetManualPayout(){
  const amt = makeAmount(0);
  let bId = me().id, status='paid', date=todayISO();
  const body = `
    <div class="amt-display" id="ad">${amt.display()}</div>
    ${padHTML()}
    <div class="field" style="margin-top:14px"><label>Friseur</label>
      <div class="bchips">${S.barbers.map(b=>`<button class="bchip" data-b="${b.id}" aria-pressed="${b.id===bId}">${esc(b.name)}</button>`).join('')}</div>
    </div>
    <div class="field"><label>Datum</label><input type="date" id="dt" value="${date}" max="${todayISO()}"></div>
    <div class="field"><label>Status</label>
      <div class="seg"><button data-s="paid" aria-pressed="true">Ausgezahlt</button><button data-s="open" aria-pressed="false">Noch offen</button></div>
    </div>
    <button class="btn primary block" data-save>Speichern</button>`;
  openSheet('Auszahlung erfassen', body, {onMount(root){
    const ad = root.querySelector('#ad');
    root.querySelectorAll('[data-k]').forEach(b=> b.onclick = ()=>{ amt.press(b.dataset.k); ad.innerHTML=amt.display(); buzz(6); });
    root.querySelectorAll('[data-b]').forEach(b=> b.onclick = ()=>{ bId=b.dataset.b; root.querySelectorAll('[data-b]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===bId)); });
    root.querySelectorAll('[data-s]').forEach(b=> b.onclick = ()=>{ status=b.dataset.s; root.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===status)); });
    root.querySelector('#dt').onchange = e => date = e.target.value || todayISO();
    root.querySelector('[data-save]').onclick = ()=>{
      if(amt.cents<=0){ toast('Bitte Betrag eingeben'); return; }
      S.payouts.push({id:uid(), d:date, b:bId, a:amt.cents, s:status, src:'manual'});
      save(); closeSheet(); render(); toast('Auszahlung gespeichert');
    };
  }});
}
function sheetPayoutEdit(p){
  const body = `
    <div class="card" style="box-shadow:none;margin-bottom:14px">
      <div class="kv"><span class="k">Friseur</span><span class="v" style="font-size:14px">${esc(bname(p.b))}</span></div>
      <div class="kv"><span class="k">Datum</span><span class="v" style="font-size:14px">${dateShort(p.d)}</span></div>
      <div class="kv total"><span class="k">Betrag</span><span class="v">${eur(p.a)}</span></div>
    </div>
    <div class="field"><label>Status</label>
      <div class="seg"><button data-s="paid" aria-pressed="${p.s==='paid'}">Ausgezahlt</button><button data-s="open" aria-pressed="${p.s==='open'}">Noch offen</button></div>
    </div>
    <button class="btn danger block" data-del>Auszahlung löschen</button>`;
  openSheet('Auszahlung', body, {onMount(root){
    root.querySelectorAll('[data-s]').forEach(b=> b.onclick = ()=>{
      p.s = b.dataset.s; save();
      root.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===p.s));
      render(); toast(p.s==='paid'?'Als bezahlt markiert':'Als offen markiert');
    });
    root.querySelector('[data-del]').onclick = ()=>{ S.payouts = S.payouts.filter(x=>x.id!==p.id); save(); closeSheet(); render(); toast('Gelöscht'); };
  }});
}

/* ---------- Tagesabschluss ---------- */
function confirmClose(){
  const d = ui.date;
  const dayEntries = S.entries.filter(e=>e.d===d);
  const t = totals(dayEntries);
  const expSum = sum(S.expenses.filter(x=>x.d===d),x=>x.a);
  const pays = S.payouts.filter(p=>p.d===d);
  const missing = S.barbers.filter(b=> dayEntries.some(e=>e.b===b.id) && !pays.some(p=>p.b===b.id));
  const body = `
    <section class="card" style="box-shadow:none">
      ${S.barbers.map(b=>{
        const tt = totals(dayEntries.filter(e=>e.b===b.id));
        if(!tt.count) return '';
        return `<div class="kv"><span class="k">${esc(b.name)} <span style="color:var(--ink-3);font-size:12px">(${tt.count})</span></span><span class="v">${eur(tt.total)}</span></div>`;
      }).join('')}
      <div class="kv"><span class="k">Bar</span><span class="v" style="color:var(--bar)">${eur(t.bar)}</span></div>
      <div class="kv"><span class="k">Karte</span><span class="v" style="color:var(--card)">${eur(t.karte)}</span></div>
      <div class="kv"><span class="k">Ausgaben</span><span class="v" style="color:var(--open)">− ${eur(expSum)}</span></div>
      <div class="kv total"><span class="k">Umsatz gesamt</span><span class="v">${eur(t.total)}</span></div>
    </section>
    ${missing.length?`<p class="hintline" style="margin:12px 0 0;color:var(--open)">Ohne Gehaltseintrag: ${missing.map(b=>esc(b.name)).join(', ')}. Du kannst trotzdem abschließen und später nachtragen.</p>`:''}
    <button class="btn primary block" data-yes style="margin-top:14px">Tag abschließen</button>
    <button class="btn ghost block" data-no style="margin-top:10px">Zurück</button>`;
  openSheet(`Abschluss ${dateShort(d)}`, body, {onMount(root){
    root.querySelector('[data-yes]').onclick = ()=>{ S.closes[d]=true; save(); closeSheet(); render(); buzz(18); toast('Tag abgeschlossen'); };
    root.querySelector('[data-no]').onclick = ()=> closeSheet();
  }});
}

/* ---------- Export / Reset ---------- */
function csvEsc(s){ s = String(s==null?'':s); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV(range){
  const rows = [['Typ','Datum','Zeit','Friseur','Betrag','Zahlart','Kategorie','Status','Notiz']];
  const inR = d => !range || inRange(d, range);
  S.entries.filter(e=>inR(e.d)).sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t))
    .forEach(e=> rows.push(['Umsatz',e.d,e.t,bname(e.b),(e.a/100).toFixed(2).replace('.',','),e.p==='bar'?'Bar':'Karte','','',e.n||'']));
  S.expenses.filter(x=>inR(x.d)).sort((a,b)=>a.d.localeCompare(b.d))
    .forEach(x=> rows.push(['Ausgabe',x.d,'','','-'+(x.a/100).toFixed(2).replace('.',','),'',x.c,'',x.n||'']));
  S.payouts.filter(p=>inR(p.d)).sort((a,b)=>a.d.localeCompare(b.d))
    .forEach(p=> rows.push(['Gehalt',p.d,'',bname(p.b),(p.a/100).toFixed(2).replace('.',','),'','',p.s==='paid'?'ausgezahlt':'offen','']));
  const csv = rows.map(r=>r.map(csvEsc).join(';')).join('\r\n');
  const name = range ? `salon-${range[0]}_bis_${range[1]}.csv` : 'salon-alle-daten.csv';
  sheetText('CSV-Export', name, csv, `${rows.length-1} Zeilen · Semikolon-getrennt, öffnet direkt in Excel.`);
}
function confirmReset(){
  openSheet('Demo-Daten löschen?', `
    <p class="hintline">Alle Umsätze, Ausgaben und Gehälter werden gelöscht. Deine Friseur-Namen und der Salon-Name bleiben erhalten.<br><br><strong>Tipp:</strong> Mache vorher ein Backup, falls du die Daten noch brauchst.</p>
    <button class="btn danger block" data-yes style="margin-top:14px">Ja, alles löschen</button>
    <button class="btn ghost block" data-no style="margin-top:10px">Abbrechen</button>`,
    {onMount(root){
      root.querySelector('[data-yes]').onclick = ()=>{
        S.entries=[]; S.expenses=[]; S.payouts=[]; S.closes={};
        save(); closeSheet(); ui.date=todayISO(); ui.anchor=todayISO(); render(); toast('Alles gelöscht – bereit');
      };
      root.querySelector('[data-no]').onclick = ()=> closeSheet();
    }});
}


/* ============================================================
   Einrichtung · Backup · Beispieldaten
   ============================================================ */
function sheetSetup(first){
  let cols = others().map(b=>({id:b.id, name:b.name, entries:S.entries.filter(e=>e.b===b.id).length}));
  const body = `
    ${first?'<p class="hintline" style="margin:-4px 0 16px">Zwei Angaben und du kannst loslegen. Alles lässt sich später unter „Mehr“ ändern.</p>':''}
    <div class="field"><label>Salon</label>
      <input type="text" id="shop" value="${esc(S.settings.shop||'')}" placeholder="z. B. Barbershop Hamza" maxlength="30" autocomplete="off"></div>
    <div class="field"><label>Dein Name</label>
      <input type="text" id="myname" value="${esc(me().name==='Ich'?'':me().name)}" placeholder="z. B. Hamza" maxlength="24" autocomplete="off"></div>
    <div class="field"><label>Weitere Friseure</label><div id="cols"></div>
      <button class="linkbtn" data-addcol>+ Friseur hinzufügen</button></div>
    <button class="btn primary block" data-save>${first?'Los geht’s':'Speichern'}</button>`;
  openSheet(first?'Willkommen':'Salon & Friseure', body, {onMount(root){
    const box = root.querySelector('#cols');
    const draw = ()=>{
      box.innerHTML = cols.map((c,i)=>`
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input type="text" data-ci="${i}" value="${esc(c.name)}" placeholder="Name" maxlength="24" autocomplete="off"
            style="flex:1;padding:12px 13px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:15.5px;font-family:inherit">
          ${c.entries?'':`<button class="btn ghost" data-rm="${i}" style="padding:0 15px;flex:none" aria-label="Entfernen">✕</button>`}
        </div>`).join('');
      box.querySelectorAll('[data-ci]').forEach(inp=> inp.oninput = ()=> cols[+inp.dataset.ci].name = inp.value);
      box.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{ cols.splice(+b.dataset.rm,1); draw(); });
    };
    draw();
    root.querySelector('[data-addcol]').onclick = ()=>{ cols.push({id:null,name:'',entries:0}); draw(); };
    root.querySelector('[data-save]').onclick = ()=>{
      const shop = root.querySelector('#shop').value.trim();
      const mine = root.querySelector('#myname').value.trim();
      S.settings.shop = shop;
      if(mine) me().name = mine;
      const keep = new Set();
      cols.forEach(c=>{
        const n = (c.name||'').trim(); if(!n) return;
        if(c.id){ const b = barber(c.id); if(b) b.name = n; keep.add(c.id); }
        else { const id = uid(); S.barbers.push({id, name:n, me:false}); keep.add(id); }
      });
      S.barbers = S.barbers.filter(b=> b.me || keep.has(b.id) || S.entries.some(e=>e.b===b.id));
      S.settings.onboarded = true;
      save(); closeSheet(); render();
      toast(first?'Fertig – los geht’s':'Gespeichert');
    };
  }});
}

function restoreBackup(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.style.cssText='position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(inp);
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; inp.remove();
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let data;
      try{ data = JSON.parse(rd.result); }catch(e){ toast('Datei nicht lesbar'); return; }
      if(!data || !Array.isArray(data.barbers) || !Array.isArray(data.entries)){ toast('Keine gültige Sicherungsdatei'); return; }
      openSheet('Backup einspielen?', `<p class="hintline">Die Datei enthält <strong>${data.entries.length} Umsätze</strong>, ${(data.expenses||[]).length} Ausgaben und ${(data.payouts||[]).length} Gehaltseinträge.<br><br>Deine aktuellen Daten werden dabei <strong>ersetzt</strong>.</p>
        <button class="btn primary block" data-yes style="margin-top:14px">Jetzt wiederherstellen</button>
        <button class="btn ghost block" data-no style="margin-top:10px">Abbrechen</button>`,
        {onMount(r){
          r.querySelector('[data-yes]').onclick = ()=>{
            S = Object.assign(defaultState(), data);
            S.settings = Object.assign({shop:'', onboarded:true}, data.settings||{});
            save(); closeSheet(); ui.date=todayISO(); ui.anchor=todayISO(); render(); toast('Wiederhergestellt');
          };
          r.querySelector('[data-no]').onclick = ()=> closeSheet();
        }});
    };
    rd.readAsText(f);
  };
  inp.click();
}

function loadDemo(){
  if(S.entries.length){ toast('Es sind schon Daten vorhanden'); return; }
  seedDemo(S); render(); toast('Beispieldaten geladen');
}

/* ============================================================
   Service Worker – offline + Updates
   ============================================================ */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller) offerUpdate(reg);
      });
    });
  }).catch(()=>{});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return; reloading = true; location.reload();
  });
}
function offerUpdate(reg){
  openSheet('Neue Version', `<p class="hintline">Eine neuere Version der App ist bereit. Deine Daten bleiben natürlich erhalten.</p>
    <button class="btn primary block" data-up style="margin-top:14px">Jetzt aktualisieren</button>
    <button class="btn ghost block" data-later style="margin-top:10px">Später</button>`,
    {onMount(r){
      r.querySelector('[data-up]').onclick = ()=>{ if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); closeSheet(); };
      r.querySelector('[data-later]').onclick = ()=> closeSheet();
    }});
}

/* ============================================================
   Boot
   ============================================================ */
if(!S){ S = defaultState(); save(); }
document.addEventListener('gesturestart', e=> e.preventDefault());
document.addEventListener('dblclick', e=> e.preventDefault(), {passive:false});
render();
if(!S.settings.onboarded) setTimeout(()=> sheetSetup(true), 400);
registerSW();

</script>
