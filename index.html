<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Salon Kasse</title>
<meta name="description" content="Tageskasse für den Friseursalon: Kunden mit Bar oder Karte erfassen, Umsatz pro Friseur, Tagesabschluss und Gehalt.">
<meta name="theme-color" content="#EEF1EE">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salon Kasse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400..700&display=swap">
<style>
/* ============================================================
   Salon Kasse — Design tokens
   Palette: enamel green-grey ground, brass accent (clippers,
   mirror fittings), slate-blue for card payments, forest green
   for paid, brick for open.
   Type: Archivo variable (wdth 62–125) used across widths —
   expanded for money figures, narrow uppercase for labels;
   Instrument Serif for the wordmark only.
   ============================================================ */
:root{
  color-scheme:light;
  --ground:#EEF1EE;
  --surface:#FFFFFF;
  --surface-2:#F5F7F4;
  --ink:#131C1A;
  --ink-2:#4C5A56;
  --ink-3:#5F6D68;
  --line:#E1E5E1;
  --line-2:#CFD5D0;
  --brass:#8A6116;
  --on-brass:#FFFFFF;
  --brass-soft:#F3E8D2;
  --bar:#8A6116;
  --bar-soft:#F3E8D2;
  --card:#2B5B71;
  --card-soft:#DEEAF0;
  --pos:#1E6B4A;
  --pos-soft:#DBEDE3;
  --open:#A5401E;
  --open-soft:#F7E1D9;
  --scrim:rgba(10,16,15,.42);
  --shadow:0 1px 2px rgba(19,28,26,.05), 0 10px 30px -16px rgba(19,28,26,.30);
  --shadow-sheet:0 -8px 40px -12px rgba(10,16,15,.28);
  --r:16px;
  --r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Archivo','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
#app{
  position:fixed;inset:0;margin:0 auto;max-width:480px;width:100%;
  display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);
  background:var(--ground);overflow:hidden;
}
@media (min-width:520px){
  body{background:var(--surface-2)}
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- top bar ---------- */
#topbar{
  min-width:0;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  background:var(--ground);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.tb-title{font-family:'Instrument Serif','Noto Sans Arabic',Georgia,serif;font-weight:400;font-size:26px;letter-spacing:-.01em;line-height:1.05}
.tb-sub{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px}
.tb-grow{flex:1;min-width:0}
.daynav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.daynav button{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2)}
.daynav button:active{background:var(--surface-2)}
.daynav .today{width:auto;padding:0 11px;font-size:12px;font-weight:600;font-stretch:90%;letter-spacing:.02em;color:var(--brass)}
.iconbtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.iconbtn:active{background:var(--surface-2)}

/* ---------- scroll region ---------- */
#view{
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:14px 14px 150px;
  display:flex;flex-direction:column;gap:12px;
}

/* ---------- type utilities ---------- */
.eyebrow{
  font-size:10.5px;font-weight:600;font-stretch:86%;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.money{font-variant-numeric:tabular-nums;font-stretch:112%;letter-spacing:-.015em}
.hero-fig{font-size:clamp(33px,9.6vw,41px);font-weight:700;line-height:1.05}
.num{font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px;margin:10px 0 -5px}
.sec-act{
  font-size:12.5px;font-weight:600;color:var(--brass);
  display:inline-block;padding:13px 10px;margin:-13px -10px;border-radius:9px;
}
.sec-act:active{background:var(--brass-soft)}

/* hero */
.hero{padding:16px 16px 14px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hero-fig{margin:6px 0 0}
.hero-meta{margin-top:3px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.split{display:flex;gap:8px;margin-top:14px}
.split .chip{flex:1}
.chip{
  display:flex;flex-direction:column;gap:1px;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
}
.chip .k{font-size:10.5px;font-weight:600;font-stretch:86%;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.chip .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%}
.chip.bar{background:var(--bar-soft);border-color:transparent}
.chip.bar .k,.chip.bar .v{color:var(--bar)}
.chip.karte{background:var(--card-soft);border-color:transparent}
.chip.karte .k,.chip.karte .v{color:var(--card)}

/* stacked payment bar */
.calc{margin:16px -16px -14px;border-top:1px solid var(--line)}
.calc .kv{padding:10px 16px}
.pbar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:12px}
.pbar i{display:block;height:100%}
.pbar i.b{background:var(--bar)}
.pbar i.k{background:var(--card)}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:11px;padding:12px 15px;
  border-top:1px solid var(--line);text-align:start;width:100%;
}
.rows .row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row .lead{width:44px;flex:none;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.row .main{flex:1;min-width:0}
.row .main>span{display:block}
.row .t1{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--ink-3);margin-top:1px}
.row .amt{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%;white-space:nowrap}
.pay-dot{width:9px;height:9px;border-radius:99px;flex:none}
.pay-dot.b{background:var(--bar)}
.pay-dot.k{background:var(--card)}
.paylbl{font-size:11px;color:var(--ink-3);white-space:nowrap;font-weight:500;min-width:34px}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:600;font-stretch:92%;letter-spacing:.02em;white-space:nowrap;
}
.pill.paid{background:var(--pos-soft);color:var(--pos)}
.pill.open{background:var(--open-soft);color:var(--open)}
.pill.me{background:var(--brass-soft);color:var(--brass)}
.pill.neutral{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.closed{background:var(--pos-soft);color:var(--pos)}
.pill.act-chip{background:var(--brass);color:var(--on-brass);padding:5px 12px}

/* segmented */
.seg{display:flex;gap:3px;background:var(--surface-2);border:0;border-radius:11px;padding:3px}
.seg button{
  flex:1;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:600;font-stretch:96%;
  color:var(--ink-2);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.10)}

/* barber chips */
.bchips{display:flex;gap:7px;overflow-x:auto;padding:1px 4px 3px;scrollbar-width:none}
.bchips::-webkit-scrollbar{display:none}
.bchip{
  padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;font-stretch:96%;color:var(--ink-2);white-space:nowrap;flex:none;
}
.bchip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:14px;font-size:15px;font-weight:600;font-stretch:100%;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink);
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brass);color:var(--on-brass);border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--open);border-color:var(--open-soft);background:var(--open-soft)}
.btn.danger.apart{margin-top:26px;position:relative}
.btn.danger.apart::before{
  content:'';position:absolute;left:0;right:0;top:-14px;height:1px;background:var(--line);
}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}

/* FAB dock */
#fab{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);
  padding:14px 14px 12px;pointer-events:none;
  background:var(--ground);
  box-shadow:0 -16px 20px -10px var(--ground);
}
#fab .btn{pointer-events:auto;box-shadow:var(--shadow)}
#fab .btn:not(.primary){background:var(--surface);border:1.5px solid var(--brass);color:var(--brass)}
#fab .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#fab .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px}
#fab .duo .btn{pointer-events:auto;padding:14px 6px;font-size:13.5px;box-shadow:var(--shadow);
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;text-align:center}
#fab .duo .btn:not(.primary):not(.ghost){background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
#fab .trio .btn{pointer-events:auto;padding:14px 4px;font-size:13.5px;gap:5px;box-shadow:var(--shadow);
  min-width:0;overflow:hidden;white-space:nowrap}
#fab .trio .btn:not(.primary){background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
#fab .trio svg{width:15px;height:15px;flex:none}

/* tab bar */
#tabbar{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  border-top:1px solid var(--line);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:var(--ink-3);
}
#tabbar button .lbl{font-size:11px;font-weight:600;font-stretch:92%;letter-spacing:.02em;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabbar button[aria-current="page"]{color:var(--brass)}
#tabbar svg{width:22px;height:22px}

/* empty */
.empty{padding:34px 20px;text-align:center;color:var(--ink-3)}
.empty .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.empty .sm{font-size:13px;line-height:1.5}

/* bars in report */
.brow{padding:12px 15px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brow .nm{font-size:14.5px;font-weight:600}
.brow .vl{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%}
.brow .l2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.track{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;opacity:.75}
.track i{display:block;height:100%;background:var(--brass);border-radius:99px}

/* key-value list */
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:14px;color:var(--ink-2)}
.kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-stretch:104%}
.kv.total{background:var(--surface-2)}
.kv.total .k{color:var(--ink);font-weight:600}
.kv.total .v{font-size:17px}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s ease}
.sheet-wrap.in .scrim{opacity:1}
.sheet{
  position:relative;width:100%;max-width:480px;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-sheet);
  padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  max-height:88vh;              /* Rückfall für ältere iPhones */
  max-height:88dvh;
  overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
}
.sheet-wrap.in .sheet{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:2px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-title{font-size:17px;font-weight:700;font-stretch:104%;letter-spacing:-.01em}
.sheet-x{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}

/* amount display */
.amt-display{
  display:flex;align-items:baseline;justify-content:center;gap:6px;
  padding:12px 0 14px;
}
.amt-display .n{
  font-size:clamp(40px,12vw,48px);font-weight:700;font-stretch:115%;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
}
.amt-display .n.zero{color:#9AA6A2}
.amt-display .cur{font-size:22px;font-weight:600;color:var(--ink-3)}
.caret{display:inline-block;width:2px;height:.82em;background:var(--brass);margin-left:2px;border-radius:2px;animation:blink 1.1s steps(1) infinite;vertical-align:baseline}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

.quick{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{
  padding:8px 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none;
}
.quick button:active{background:var(--brass-soft);color:var(--brass)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{
  height:54px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;transition:transform .06s ease,background .12s ease;
}
.pad button:active{transform:scale(.95);background:var(--brass-soft);color:var(--brass)}
.pad button.util{font-size:19px;color:var(--ink-2)}

.pay2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.pay-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:15px 8px;border-radius:15px;
  font-size:15px;font-weight:700;font-stretch:102%;border:1px solid transparent;
}
.pay-btn .sub{font-size:10.5px;font-weight:600;font-stretch:88%;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.pay-btn.b{background:var(--bar);color:var(--on-brass)}
.pay-btn.k{background:var(--card);color:#fff}
.pay-btn:active{transform:scale(.98)}
.pay-btn[aria-disabled="true"]{border-color:var(--line)}
.pay-btn.b[aria-disabled="true"]{background:var(--bar-soft);color:var(--bar)}
.pay-btn.k[aria-disabled="true"]{background:var(--card-soft);color:var(--card)}
.pay-btn[aria-disabled="true"]:active{transform:scale(.98)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;font-stretch:86%;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field textarea,.field select{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--ink);font-size:15.5px;font-family:inherit;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brass);background:var(--surface)}
.field input,.field textarea{scroll-margin-bottom:120px}
.hintline{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.linkbtn{display:flex;align-items:center;width:100%;text-align:start;min-height:44px;font-size:13.5px;font-weight:600;color:var(--brass);padding:0}

.toast{
  position:fixed;left:50%;transform:translate(-50%,14px);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;
  font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.22s ease;pointer-events:none;
  max-width:90vw;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
.toast .undo{
  pointer-events:auto;color:var(--brass);font-weight:700;font-size:13.5px;
  padding:4px 2px;flex:none;white-space:nowrap;
}
.toast.in{opacity:1;transform:translate(-50%,0)}

.wordmark{font-family:'Instrument Serif','Noto Sans Arabic',Georgia,serif;font-size:30px;line-height:1;letter-spacing:-.01em}
.wordmark em{font-style:italic;color:var(--brass)}

/* --- Arabisch: von rechts nach links; Zahlen bleiben lateinisch --- */
[dir="rtl"] .money,[dir="rtl"] .num,[dir="rtl"] .amt,[dir="rtl"] .row .lead,
[dir="rtl"] .kv .v,[dir="rtl"] .brow .vl,[dir="rtl"] .chip .v,[dir="rtl"] .hero-fig,
[dir="rtl"] .amt-display,[dir="rtl"] .pad,[dir="rtl"] input[type="date"]{
  direction:ltr;unicode-bidi:isolate;
}
[dir="rtl"] .kv .v,[dir="rtl"] .brow .vl,[dir="rtl"] .amt{text-align:right}
[dir="rtl"] .chip .v,[dir="rtl"] .hero-fig,[dir="rtl"] .row .lead{text-align:left}
[dir="rtl"] .eyebrow{letter-spacing:0}
[dir="rtl"] .backup-card{text-align:right}

/* ══════════ Studio: Kennzahlen, Diagramme, Tabellen ══════════ */
:root{
  --ground:#F4F5F7; --surface:#FFFFFF; --surface-2:#F7F8FA;
  --ink:#14151A; --ink-2:#585C68; --ink-3:#6B7180;
  --line:#ECEEF2; --line-2:#DDE0E7;
  --brass:#17181D; --on-brass:#fff; --brass-soft:#EEEFF3;
  --bar:#8A5A0F; --bar-soft:#FDF2DE; --card:#245C8F; --card-soft:#E5EFF9;
  --pos:#0F7A52; --pos-soft:#E4F5EC; --open:#B4402A; --open-soft:#FCE9E4;
  --shadow:0 1px 2px rgba(20,21,26,.04), 0 8px 24px -14px rgba(20,21,26,.22);
  --r:20px; --r-sm:14px;
}
body,#app{font-family:'Manrope','Archivo','Noto Sans Arabic',system-ui,sans-serif;letter-spacing:-.005em}
#view{gap:12px}
#topbar{background:var(--ground);border-bottom:0;padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:6px;gap:12px}
.tb-title{font-family:'Manrope','Noto Sans Arabic',sans-serif;font-weight:800;font-size:19.5px;
  letter-spacing:-.025em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;

  <div id="fab"></div>

<div id="sheetRoot"></div>

<script>

"use strict";

/* ============================================================
   Storage
   ============================================================ */
const KEY = 'salonkasse.v1';
const EMBEDDED = (()=>{ try{ return window.top !== window.self; }catch(e){ return true; } })();
const APP_VERSION = '1.0';
const uid = () => Math.random().toString(36).slice(2,10);

function defaultState(){
  return {
    v:1,
    settings:{ shop:'', onboarded:false },
    barbers:[ {id:'b1', name:'Ich', me:true, start:0} ],
    entries:[],   // {id,d,t,b,a,p,n}
    expenses:[],  // {id,d,a,c,n}
    payouts:[],   // {id,d,b,a,s,src}
    closes:{}     // {'YYYY-MM-DD':true}
  };
}
let S;
try{
  const raw = localStorage.getItem(KEY);
  S = raw ? JSON.parse(raw) : null;
}catch(e){ S = null; }

/* Aeltere Daten auf das aktuelle Modell heben. Wird auch beim Wiederherstellen
   eines Backups oder eines Standes aufgerufen. */
function migrate(st){
  if(!st) return st;
  if(st.settings && st.settings.onboarded === undefined)
    st.settings.onboarded = Array.isArray(st.entries) && st.entries.length > 0;
  (st.barbers||[]).forEach(b=>{ if(typeof b.start !== 'number') b.start = 0; });
  /* Frueher: ein Betrag pro Tag mit Haken "ausgezahlt/offen".
     Jetzt: zwei Zahlen - verdient (a) und ausgezahlt (pd).
     Ein als ausgezahlt markierter Tag heisst: an dem Tag verdient und auch bekommen. */
  (st.payouts||[]).forEach(p=>{
    if(typeof p.pd !== 'number'){ p.pd = (p.s === 'paid') ? p.a : 0; }
    delete p.s;
  });
  /* Frueher konnten mehrere Eintraege auf denselben Tag fallen - etwa wenn eine
     Auszahlung einen Tag aufgeteilt hat. Pro Friseur und Tag gibt es jetzt genau
     einen Eintrag, sonst erwischt der Dialog nur einen davon. */
  const nach = [];
  (st.payouts||[]).forEach(p=>{
    const vorh = nach.find(x=> x.d===p.d && x.b===p.b);
    if(vorh){ vorh.a += p.a; vorh.pd += p.pd; }
    else nach.push(p);
  });
  st.payouts = nach;
  return st;
}
migrate(S);

/* ============================================================
   Dauerhafte Speicherung
   localStorage (schnell) + IndexedDB (überlebt mehr) + tägliche
   Wiederherstellungspunkte. Zusätzlich fragen wir den Browser um
   Erlaubnis, die Daten nicht automatisch aufzuräumen.
   ============================================================ */
const IDB_NAME='salonkasse', IDB_STORE='kv';
let idbP = null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res,rej)=>{
    if(typeof indexedDB === 'undefined') return rej(new Error('kein IndexedDB'));
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = ()=>{
      const db = rq.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror   = ()=> rej(rq.error);
  });
  idbP.catch(()=>{ idbP = null; });
  return idbP;
}
function idbPut(key,val){
  return idb().then(db=> new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> rej(tx.error);
  })).catch(()=> false);
}
function idbGet(key){
  return idb().then(db=> new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror   = ()=> rej(rq.error);
  })).catch(()=> undefined);
}

let saveT = null;
function save(){
  S.settings.savedAt = Date.now();
  const json = JSON.stringify(S);
  try{ localStorage.setItem(KEY, json); }catch(e){}
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ idbPut('state', JSON.parse(json)); snapshot(); }, 500);
}

/* Ein Stand pro Tag, die letzten zehn werden aufgehoben. */
function snapshot(){
  const d = todayISO();
  idbGet('snapshots').then(list=>{
    list = Array.isArray(list) ? list : [];
    const rec = { d, at: Date.now(), n: S.entries.length, s: JSON.parse(JSON.stringify(S)) };
    if(list.length && list[list.length-1].d === d) list[list.length-1] = rec;
    else list.push(rec);
    while(list.length > 10) list.shift();
    return idbPut('snapshots', list);
  });
}

/* Nur einspringen, wenn lokal wirklich nichts mehr da ist. */
function recoverFromIDB(){
  if((S.entries||[]).length > 0) return;
  idbGet('state').then(data=>{
    if(!data || !Array.isArray(data.entries) || !data.entries.length) return;
    S = migrate(data);
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    render();
    toast(tr('t_recovered'));
  });
}

let storageInfo = { persisted:null, usage:null, snaps:0 };
function askPersist(){
  if(!(typeof navigator!=='undefined' && navigator.storage && navigator.storage.persist))
    return Promise.resolve(false);
  return navigator.storage.persist().then(ok=>{
    storageInfo.persisted = ok;
    toast(ok ? tr('t_persist_on') : tr('t_persist_no'));
    if(ui.tab==='mehr') render();
    return ok;
  }).catch(()=> false);
}
function setLang(k){
  if(!LANGS[k] || k === LANG) return;
  LANG = k; S.settings.lang = k; save(); applyLang(); render(); buzz(8);
}

function refreshStorageInfo(){
  const st = (typeof navigator!=='undefined' && navigator.storage) ? navigator.storage : null;
  const jobs = [];
  if(st && st.persisted) jobs.push(st.persisted().then(p=>{storageInfo.persisted=p}).catch(()=>{}));
  if(st && st.estimate)  jobs.push(st.estimate().then(e=>{storageInfo.usage=e.usage}).catch(()=>{}));
  jobs.push(idbGet('snapshots').then(l=>{ storageInfo.snaps = Array.isArray(l)?l.length:0; }).catch(()=>{}));
  Promise.all(jobs).then(()=>{ if(ui.tab==='mehr') render(); }).catch(()=>{});
}
const daysSince = ts => ts ? Math.floor((Date.now()-ts)/86400000) : null;

function sheetSnapshots(){
  idbGet('snapshots').then(list=>{
    list = Array.isArray(list) ? list.slice().reverse() : [];
    const body = list.length ? `
      <p class="hintline" style="margin:-4px 0 14px">${tr('snaps_hint')}</p>
      <section class="card" style="box-shadow:none"><div class="rows">${list.map((s,i)=>`
        <button class="row" data-sn="${i}">
          <span class="main"><span class="t1">${dateLabel(s.d)}</span><span class="t2">${tr('n_revenues', s.n)}</span></span>
          <span class="amt money" style="font-size:13px;color:var(--ink-3)">${tr('restore_l')}</span>
        </button>`).join('')}</div></section>`
      : `<p class="hintline">${tr('no_snaps')}</p>`;
    openSheet(tr('snapshots'), body, {onMount(root){
      root.querySelectorAll('[data-sn]').forEach(b=> b.onclick = ()=>{
        const snap = list[+b.dataset.sn];
        openSheet(tr('sh_snap_q'), `<p class="hintline">${tr('snap_txt', dateLabel(snap.d), snap.n)}</p>
          <button class="btn primary block" data-yes style="margin-top:14px">${tr('yes_snap')}</button>
          <button class="btn ghost block" data-no style="margin-top:10px">${tr('cancel')}</button>`,
          {onMount(r2){
            r2.querySelector('[data-yes]').onclick = ()=>{
              S = migrate(snap.s); save(); closeSheet(); render(); toast(tr('t_snap_restored'));
            };
            r2.querySelector('[data-no]').onclick = ()=> closeSheet();
          }});
      });
    }});
  });
}

/* ============================================================
   Sprachen – Deutsch, Französisch, Arabisch
   Wichtig: Exporte (PDF und CSV) bleiben immer deutsch,
   dafür sorgt inGerman() weiter unten.
   ============================================================ */

function detectLang(){
  try{
    const l = (navigator.languages && navigator.languages[0]) || navigator.language || '';
    const k = String(l).slice(0,2).toLowerCase();
    if(LANGS[k]) return k;
  }catch(e){}
  return 'de';
}
let LANG = (S && S.settings && LANGS[S.settings.lang]) ? S.settings.lang : detectLang();
function tr(k, a, b, c){
  let s = (DICT[LANG] && DICT[LANG][k] !== undefined) ? DICT[LANG][k] : DICT.de[k];
  if(s === undefined) return k;
  if(a !== undefined) s = s.split('{0}').join(a);
  if(b !== undefined) s = s.split('{1}').join(b);
  if(c !== undefined) s = s.split('{2}').join(c);
  return s;
}
const isRTL = () => LANG === 'ar';
/* Exporte laufen immer auf Deutsch – Datum, Monatsnamen und Zahlenformat. */
function inGerman(fn){
  const prev = LANG;
  LANG = 'de';
  try{ return fn(); } finally { LANG = prev; }
}
function applyLang(){
  try{
    document.documentElement.lang = LANG;
    document.documentElement.dir = isRTL() ? 'rtl' : 'ltr';
  }catch(e){}
}

/* ============================================================
   Date + money helpers
   ============================================================ */
const cal = () => CAL[LANG] || CAL.de;

const pad2 = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromISO = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
const todayISO = () => iso(new Date());
const addDays = (s,n) => { const d=fromISO(s); d.setDate(d.getDate()+n); return iso(d); };

const _nfCache = {};
function nf(withCents){
  const loc = NUMLOC[LANG] || 'de-DE';
  const key = loc + (withCents ? '|2' : '|0');
  return _nfCache[key] || (_nfCache[key] = new Intl.NumberFormat(loc,
    withCents ? {minimumFractionDigits:2, maximumFractionDigits:2} : {maximumFractionDigits:0}));
}
const eur  = c => nf(true).format((c||0)/100) + ' €';
const eurShort = c => (c % 100 === 0) ? eur0(c) : eur(c);   // 16 € bzw. 15,50 €
const eur0 = c => nf(false).format(Math.round((c||0)/100)) + ' €';

function dateLabel(s){
  const d = fromISO(s);
  return `${cal().wd[d.getDay()]}${cal().sep}${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;
}
function dateShort(s){
  const d = fromISO(s);
  return `${cal().wds[d.getDay()]} ${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.`;
}
const CATS = ['Material','Miete','Sonstiges'];
const catLabel = c => c==='Material' ? tr('c_material')
                    : c==='Miete'    ? tr('c_rent')
                    : c==='Sonstiges'? tr('c_other') : c;
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function isoWeek(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 4 - (t.getDay()||7));
  const y0 = new Date(t.getFullYear(),0,1);
  return { week: Math.ceil((((t-y0)/86400000)+1)/7), year: t.getFullYear() };
}
function weekStart(s){
  const d = fromISO(s); const off = (d.getDay()+6)%7;
  d.setDate(d.getDate()-off); return iso(d);
}

/* ============================================================
   Demo data (deterministic)
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedDemo(st){
  const rnd = mulberry32(20260829);
  const services = [
    ['Herrenschnitt',2200,2800],['Schnitt + Bart',3200,3800],['Bart',1200,1600],
    ['Kinderschnitt',1500,1800],['Färben',5500,9000],['Waschen + Schnitt',2600,3200],
    ['Maschinenschnitt',1500,1800],['Rasur',2000,2500]
  ];
  const names = ['Ali','Mehmet','Herr Weber','Yannick','Sami','Herr Klein','Deniz','Jonas','Herr Braun','Emre','Luca','Herr Schmidt'];
  const start = 44;
  for(let k=start;k>=0;k--){
    const d = addDays(todayISO(), -k);
    const dow = fromISO(d).getDay();
    if(dow===0) continue;                       // Sonntag zu
    if(dow===1 && rnd()<0.55) continue;         // manchmal Montag zu
    st.barbers.forEach((b,bi)=>{
      if(bi===2 && rnd()<0.62) return;          // Karim nur manchmal
      const n = 5 + Math.floor(rnd()* (bi===0?9:7));
      for(let i=0;i<n;i++){
        const sv = services[Math.floor(rnd()*services.length)];
        const a = Math.round((sv[1] + rnd()*(sv[2]-sv[1]))/50)*50;
        const hh = 9 + Math.floor(rnd()*10), mm = Math.floor(rnd()*12)*5;
        st.entries.push({
          id:uid(), d, t:`${pad2(hh)}:${pad2(mm)}`, b:b.id, a,
          p: rnd()<0.46?'bar':'karte',
          n: rnd()<0.5 ? sv[0] : (rnd()<0.5 ? names[Math.floor(rnd()*names.length)] : '')
        });
      }
    });
    if(rnd()<0.28){
      const cats=['Material','Sonstiges','Miete'];
      const c = cats[Math.floor(rnd()*cats.length)];
      st.expenses.push({id:uid(), d, a: c==='Miete'?95000:Math.round((1500+rnd()*12000)/100)*100, c, n: c==='Material'?'Farbe & Pflege':''});
    }
    // Tagesabschluss für vergangene Tage
    if(k>0){
      st.closes[d]=true;
      st.barbers.forEach((b,bi)=>{
        const rev = st.entries.filter(e=>e.d===d && e.b===b.id).reduce((s,e)=>s+e.a,0);
        if(!rev) return;
        const amt = Math.round(rev*(bi===0?0.42:0.45)/500)*500;
        const bezahlt = (k>6 || rnd()<0.55) ? amt : Math.round(amt*rnd()/500)*500;
        st.payouts.push({id:uid(), d, b:b.id, a:amt, pd:bezahlt, src:'close'});
      });
    }
  }
  save();
}

/* ============================================================
   Selectors
   ============================================================ */
const me = () => S.barbers.find(b=>b.me) || S.barbers[0];
const others = () => S.barbers.filter(b=>!b.me);
const barber = id => S.barbers.find(b=>b.id===id);
const bname = id => { const b = barber(id); return b ? b.name : tr('deleted_barber'); };
/* Auch Friseure beruecksichtigen, die es nicht mehr gibt, deren Umsaetze aber
   noch in den Daten stehen - sonst passt die Aufschluesselung nicht zur Summe. */
function barbersOf(list){
  const ids = S.barbers.map(b=>b.id);
  list.forEach(e=>{ if(ids.indexOf(e.b) < 0) ids.push(e.b); });
  return ids.map(id=>{ const b = barber(id); return b || {id, name:bname(id), me:false, weg:true}; });
}

const entriesOn = d => S.entries.filter(e=>e.d===d).sort((a,b)=> b.t.localeCompare(a.t));
const sum = (arr,f) => arr.reduce((s,x)=>s+f(x),0);
/* Anteile Bar/Karte. Einzeln gerundet ergeben sie manchmal 99 oder 101 Prozent,
   deshalb wird der zweite Wert aus dem ersten abgeleitet. */
function pctPair(t){
  if(!t.total) return {bar:0, karte:0};
  const bar = Math.round(t.bar / t.total * 100);
  return {bar, karte: 100 - bar};
}

/* Gehalt eines Friseurs: verdient, ausgezahlt, offen.
   Offen ist immer ein laufender Saldo, kein Wert pro Tag. */
function salOf(bId, range){
  const ps = S.payouts.filter(p=> p.b===bId && (!range || inRange(p.d, range)));
  return { verdient: sum(ps,p=>p.a), ausgezahlt: sum(ps,p=>p.pd) };
}
function salOpen(bId){
  const b = barber(bId), g = salOf(bId);
  return ((b && b.start) || 0) + g.verdient - g.ausgezahlt;
}
function salOpenAll(){
  return barbersOf(S.payouts.map(p=>({b:p.b}))).reduce((s,b)=> s + salOpen(b.id), 0);
}
/* Eintrag eines Tages holen oder anlegen. */
function salEntry(bId, date, anlegen){
  let p = S.payouts.find(x=> x.d===date && x.b===bId);
  if(!p && anlegen){ p = {id:uid(), d:date, b:bId, a:0, pd:0, src:'close'}; S.payouts.push(p); }
  return p;
}

function totals(list){
  return {
    total: sum(list,e=>e.a),
    bar: sum(list.filter(e=>e.p==='bar'),e=>e.a),
    karte: sum(list.filter(e=>e.p==='karte'),e=>e.a),
    count: list.length
  };
}
function rangeOf(kind, anchor){
  if(kind==='tag') return [anchor, anchor];
  if(kind==='woche'){ const a=weekStart(anchor); return [a, addDays(a,6)]; }
  if(kind==='monat'){ const d=fromISO(anchor); return [iso(new Date(d.getFullYear(),d.getMonth(),1)), iso(new Date(d.getFullYear(),d.getMonth()+1,0))]; }
  const y=fromISO(anchor).getFullYear(); return [`${y}-01-01`, `${y}-12-31`];
}
const inRange = (d,r) => d>=r[0] && d<=r[1];

   ============================================================ */
let toastT;
function toast(msg, undo){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.innerHTML = '';
  const txt = document.createElement('span');
  txt.textContent = msg;
  el.appendChild(txt);
  if(undo){
    const b = document.createElement('button');
    b.className = 'undo';
    b.textContent = tr('undo');
    b.onclick = ()=>{ clearTimeout(toastT); el.classList.remove('in'); undo(); };
    el.appendChild(b);
  }
  requestAnimationFrame(()=> el.classList.add('in'));
  clearTimeout(toastT);
  toastT = setTimeout(()=>{ el.classList.remove('in'); }, undo ? 6000 : 1900);
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms||8); }catch(e){} }

let sheetEl = null;
/* Auf dem iPhone schiebt die Tastatur Eingabefelder aus dem Bild – nachführen. */
function keepVisible(root){
  root.querySelectorAll('input[type="text"],textarea').forEach(el=>{
    el.addEventListener('focus', ()=> setTimeout(()=>{
      try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
    }, 320));
  });
}

function openSheet(title, bodyHTML, opts){
  closeSheet(true);
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="scrim"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab"></div>
      <div class="sheet-head">
        <div class="sheet-title">${esc(title)}</div>
        <button class="sheet-x" data-close aria-label="Schließen">${I.x}</button>
      </div>
      <div class="sheet-body">${bodyHTML}</div>
    </section>`;
  document.getElementById('sheetRoot').appendChild(wrap);
  sheetEl = wrap;
  wrap.querySelector('.scrim').addEventListener('click', ()=>closeSheet());
  wrap.querySelector('[data-close]').addEventListener('click', ()=>closeSheet());
  requestAnimationFrame(()=> wrap.classList.add('in'));
  if(opts && opts.onMount) opts.onMount(wrap.querySelector('.sheet-body'), wrap);
  keepVisible(wrap);
  return wrap;
}
function closeSheet(instant){
  if(!sheetEl) return;
  const el = sheetEl; sheetEl = null;
  if(instant){ el.remove(); return; }
  el.classList.remove('in');
  setTimeout(()=> el.remove(), 280);
}

/* ---------- amount buffer ---------- */
function makeAmount(initialCents){
  let buf = '';
  let fresh = false;          // vorbelegt: die erste Ziffer ersetzt den alten Betrag
  if(initialCents){
    const s = (initialCents/100).toFixed(2).replace('.',',');
    buf = s.endsWith(',00') ? s.slice(0,-3) : s;
    fresh = true;
  }
  return {
    get raw(){ return buf; },
    get cents(){
      if(!buf) return 0;
      return Math.round(parseFloat(buf.replace(',','.'))*100) || 0;
    },
    press(k){
      if(k==='del'){ fresh = false; buf = buf.slice(0,-1); return; }
      if(fresh){ buf = ''; fresh = false; }
      if(k===','){ if(buf.includes(',')) return; buf = buf===''? '0,' : buf+','; return; }
      if(buf.includes(',')){ if(buf.split(',')[1].length>=2) return; }
      else if(buf.replace('-','').length>=6) return;
      if(buf==='0' && k!=='0') buf = k; else if(buf==='0' && k==='0') return; else buf += k;
    },
    set(cents){ fresh = false; const s=(cents/100).toFixed(2).replace('.',','); buf = s.endsWith(',00')? s.slice(0,-3):s; },
    display(){
      if(!buf) return '<span class="n zero">0<span class="caret"></span></span><span class="cur">€</span>';
      const [i,d] = buf.split(',');
      const gi = new Intl.NumberFormat('de-DE').format(parseInt(i||'0',10));
      return `<span class="n">${gi}${buf.includes(',')?','+esc(d||''):''}<span class="caret"></span></span><span class="cur">€</span>`;
    }
  };
}
function padHTML(){
  const keys = ['1','2','3','4','5','6','7','8','9',',','0','del'];
  return `<div class="pad">${keys.map(k=>
    `<button data-k="${k}" class="${k===','||k==='del'?'util':''}" aria-label="${k==='del'?'Löschen':k}">${k==='del'?'⌫':k}</button>`
  ).join('')}</div>`;
}
function quickAmounts(){
  const freq = {};
  S.entries.slice(-400).forEach(e=>{ freq[e.a] = (freq[e.a]||0)+1; });
  const top = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,5).map(Number).sort((a,b)=>a-b);
  return top.length>=3 ? top : [1500,2000,2500,3000,3500];
}

      root.querySelectorAll('[data-f]').forEach(b=> b.setAttribute('aria-pressed', b.dataset.f===aktiv));

/* Vergleich mit dem Vorzeitraum. Ohne Vorwert gibt es keinen Prozentwert. */
function delta(jetzt, vorher){
  if(!vorher) return jetzt ? {cls:'up', txt:tr('new_l')} : {cls:'flat', txt:'—'};
  const p = Math.round((jetzt - vorher) / vorher * 100);
  if(p === 0) return {cls:'flat', txt:'0 %'};
  return {cls: p>0?'up':'down', txt:(p>0?'+':'') + p + ' %', ico: p>0?IK.up:IK.down};
}
function kTile(cls, ico, lab, val, d, sub){
  return `<div class="k-tile ${cls}">
    <div class="k-top"><span class="k-lab">${esc(lab)}</span><span class="k-ico">${ico}</span></div>
    <span class="k-val money">${val}</span>
    ${d ? `<span class="k-delta ${d.cls}">${d.ico||''}${d.txt}</span>` : ''}
    ${sub ? `<span class="k-sub">${sub}</span>` : ''}
  </div>`;
}
function kpiGrid(t, tVor, ganzerSalon){

    ${kTile('lila', IK.users, tr('cust_n'), String(t.count), delta(t.count, tVor.count),
            t.count ? 'ø ' + eur(Math.round(t.total/t.count)) : '')}
    ${kTile('gold', IK.cash,  tr('bar'), eur(t.bar), null, pctPair(t).bar + ' %')}
    ${kTile('blau', IK.card,  tr('card'), eur(t.karte), null, pctPair(t).karte + ' %')}
  </section>`;
}
/* Balken der letzten sieben Tage, der gewählte Tag hervorgehoben. */
function weekChart(passt){
  const tage = [];
  for(let i=6;i>=0;i--){
    const d = addDays(ui.date, -i);
    tage.push({d, v: sum(S.entries.filter(e=> e.d===d && passt(e)), e=>e.a)});
  }
  const max = Math.max(1, ...tage.map(x=>x.v));
  return `<section class="card chart">
    <div class="c-head"><span class="c-title">${tr('last7')}</span><span class="c-sub money">${eur(sum(tage,x=>x.v))}</span></div>
    <div class="bars">${tage.map((x,i)=>`
      <div class="bcol${i===6?' hi':''}">
        ${x.v?`<b>${eur0(x.v)}</b>`:''}
        <i style="height:${Math.max(3, x.v/max*100)}%"></i>
        <span>${cal().wds[fromISO(x.d).getDay()]}</span>
      </div>`).join('')}</div>
  </section>`;
}
/* Ring: Anteil Bar an Karte. */
function ringCard(t){
  const ges = t.total || 1;
  const U = 2 * Math.PI * 42;
  const barLen = t.bar / ges * U;
  return `<section class="card ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--card)" stroke-width="15"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--bar)" stroke-width="15"
        stroke-dasharray="${barLen.toFixed(2)} ${(U-barLen).toFixed(2)}"/>
      <circle cx="50" cy="50" r="30" fill="var(--surface)"/>
    </svg>
    <div class="ring-leg">
      <div class="leg"><span class="lw"><i style="background:var(--bar)"></i><span class="lt">${tr('bar')} ${pctPair(t).bar} %</span></span><span class="lv money">${eur(t.bar)}</span></div>

function renderTopbar(){
  const tb = document.getElementById('topbar');
  const chPrev = isRTL() ? I.right : I.left, chNext = isRTL() ? I.left : I.right;
  const kuerzel = (me().name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const ava = `<div class="ava">${esc(kuerzel)}</div>`;
  const dayNav = `
    <div class="daynav">
      <button data-day="-1" aria-label="${tr('a_prevday')}">${chPrev}</button>
      ${ui.date!==todayISO() ? `<button class="today" data-today>${tr('today')}</button>` : ''}
      <button data-day="1" aria-label="${tr('a_nextday')}" ${ui.date>=todayISO()?'disabled style="opacity:.3"':''}>${chNext}</button>
    </div>`;

  if(ui.tab==='heute' || ui.tab==='team' || ui.tab==='kasse'){
    const titles = {heute:tr('hd_today'), team:tr('tab_team'), kasse:tr('tab_cash')};
    tb.innerHTML = `${ava}
      <div class="tb-grow">
        <div class="tb-title">${titles[ui.tab]}</div>
        <button class="tb-sub" data-pickdate style="display:flex;align-items:center;gap:5px">
          ${S.closes[ui.date] ? dateShort(ui.date)+' · '+tr('closed') : dateLabel(ui.date)}
        </button>
      </div>
      ${dayNav}`;
    tb.querySelectorAll('[data-day]').forEach(b=> b.onclick = ()=>{
      const n = +b.dataset.day;
      if(n>0 && ui.date>=todayISO()) return;
      ui.date = addDays(ui.date,n); render();
    });
    const t = tb.querySelector('[data-today]'); if(t) t.onclick = ()=>{ ui.date=todayISO(); render(); };
    tb.querySelector('[data-pickdate]').onclick = ()=>{
      const inp = document.createElement('input');
      inp.type='date'; inp.value=ui.date; inp.max=todayISO();
      inp.style.cssText='position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(inp);
      inp.onchange = ()=>{ if(inp.value){ ui.date=inp.value; render(); } inp.remove(); };
      inp.showPicker ? inp.showPicker() : inp.click();
    };
  } else if(ui.tab==='bericht'){
    tb.innerHTML = `${ava}<div class="tb-grow"><div class="tb-title">${tr('tab_report')}</div><div class="tb-sub">${esc(periodLabel())}</div></div>
      <div class="daynav">
        <button data-p="-1" aria-label="${tr('a_prev')}">${chPrev}</button>
        <button data-p="1" aria-label="${tr('a_next')}">${chNext}</button>
      </div>`;
    tb.querySelectorAll('[data-p]').forEach(b=> b.onclick = ()=>{ shiftPeriod(+b.dataset.p); render(); });
  } else {
    tb.innerHTML = `${ava}<div class="tb-grow"><div class="tb-title">${tr('tab_more')}</div><div class="tb-sub">${tr('more_sub')}</div></div>`;
  }
}

  return `<button class="card card-pad backup-card" data-backupnow style="display:block;width:100%;text-align:start;background:var(--brass-soft);border-color:transparent;box-shadow:none">
    <div class="eyebrow" style="color:var(--brass)">${tr('sec_backup')}</div>
    <div style="font-size:14.5px;font-weight:600;margin-top:3px">${d===null?tr('no_backup_yet'):tr('last_backup_days', d)}</div>
    <div class="hintline" style="color:var(--brass);opacity:.9;margin-top:2px">${tr('backup_tap')}</div>
  </button>`;
}

function periodLabel(){
  const r = rangeOf(ui.range, ui.anchor);
  if(ui.range==='tag') return dateLabel(ui.anchor);
  if(ui.range==='woche'){ const w=isoWeek(fromISO(ui.anchor)); return `${tr('cw', w.week)} · ${dateShort(r[0]).slice(3)}–${dateShort(r[1]).slice(3)}`; }
  if(ui.range==='monat'){ const d=fromISO(ui.anchor); return `${cal().mon[d.getMonth()]} ${d.getFullYear()}`; }
  return tr('year_n', fromISO(ui.anchor).getFullYear());
}
function shiftPeriod(n){
  const d = fromISO(ui.anchor);
  if(ui.range==='tag') d.setDate(d.getDate()+n);
  else if(ui.range==='woche') d.setDate(d.getDate()+7*n);
  else if(ui.range==='monat') d.setMonth(d.getMonth()+n);
  else d.setFullYear(d.getFullYear()+n);
  ui.anchor = iso(d);
}

function screenBericht(){
  const r = rangeOf(ui.range, ui.anchor);
  const ent = S.entries.filter(e=>inRange(e.d,r));
  const t = totals(ent);
  const exp = S.expenses.filter(x=>inRange(x.d,r));
  const expSum = sum(exp,x=>x.a);
  const pays = S.payouts.filter(p=>inRange(p.d,r));
  const paid = sum(pays, p=>p.pd);
  const openAll = salOpenAll();
  const laenge = (fromISO(r[1]) - fromISO(r[0]))/86400000 + 1;
  const tVor = totals(S.entries.filter(e=> inRange(e.d, [addDays(r[0], -laenge), addDays(r[0], -1)])));

  const perB = barbersOf(ent).map(b=>({b, t: totals(ent.filter(e=>e.b===b.id))}))
    .filter(x=>x.t.count>0).sort((a,b)=>b.t.total-a.t.total);
  const max = Math.max(1, ...perB.map(x=>x.t.total));

  const salRows = barbersOf(S.payouts.map(x=>({b:x.b}))).map(b=>{
    const g = salOf(b.id, r);
    const opAll = salOpen(b.id);
    if(!g.verdient && !g.ausgezahlt && !opAll) return '';
    return `<div class="brow">
      <div class="l1"><span class="nm">${esc(b.name)}${b.me?` <span class="pill me">${tr('me')}</span>`:''}</span><span class="vl">${eur(g.verdient)}</span></div>

      </div>
    </div>`;
  }).join('');

  const w = t.total||1;
  return `
    <div class="seg" id="rangeseg">
      ${['tag','woche','monat','jahr'].map(k=>`<button data-r="${k}" aria-pressed="${ui.range===k}">${tr({tag:'r_day',woche:'r_week',monat:'r_month',jahr:'r_year'}[k])}</button>`).join('')}
    </div>

    ${kpiGrid(t, tVor, true)}
    ${ringCard(t)}
    <section class="card">
      <div class="kv"><span class="k">${tr('expenses_n', exp.length)}</span><span class="v" style="color:var(--open)">− ${eur(expSum)}</span></div>
      <div class="kv"><span class="k">${tr('salary_paid')}</span><span class="v" style="color:var(--open)">− ${eur(paid)}</span></div>
      <div class="kv total"><span class="k">${tr('remains')}</span><span class="v">${eur(t.total-expSum-paid)}</span></div>
    </section>


    <div class="sec-head"><span class="eyebrow">${tr('rev_per_barber')}</span></div>
    <section class="card">${perB.length? perB.map(x=>`
      <div class="brow">
        <div class="l1"><span class="nm">${esc(x.b.name)}${x.b.me?` <span class="pill me">${tr('me')}</span>`:''}</span><span class="vl">${eur(x.t.total)}</span></div>
        <div class="track"><i style="width:${(x.t.total/max*100).toFixed(1)}%"></i></div>
        <div class="l2"><span>${tr('pct_cust', Math.round(x.t.total/w*100), x.t.count)}</span><span>ø ${eur(Math.round(x.t.total/(x.t.count||1)))}</span></div>
      </div>`).join('') : `<div class="empty"><div class="sm">${tr('no_rev_period')}</div></div>`}
    </section>

    <div class="sec-head"><span class="eyebrow">${tr('sal_paid_open')}</span></div>
    <section class="card">${salRows || `<div class="empty"><div class="sm">${tr('no_salary')}</div></div>`}</section>
    ${openAll?`<div class="card card-pad" style="background:var(--open-soft);border-color:transparent;box-shadow:none">
      <div class="eyebrow" style="color:var(--open)">${tr('open_total')}</div>

function render(){

function renderTabs(){
  const tb = document.getElementById('tabbar');
  tb.innerHTML = TABS.map(t=>`
    <button data-tab="${t.k}" ${ui.tab===t.k?'aria-current="page"':''}>
      ${t.i}<span class="lbl">${tr(t.l)}</span>

    };

      const n = nm.value.trim(); if(!n){ toast(tr('t_enter_name')); return; }

/* ---------- Auszahlen ---------- */
function sheetPayout(){
  const offen = barbersOf(S.payouts.map(p=>({b:p.b})))
    .map(b => ({ b, off: salOpen(b.id) }))
    .filter(x => x.off > 0)
    .sort((a,b) => b.off - a.off);
  if(!offen.length){ toast(tr('nothing_open_now')); buzz(10); return; }
  if(offen.length === 1) return sheetWithdraw(offen[0].b.id);
  const body = `<section class="card" style="box-shadow:none"><div class="rows">${offen.map(x=>`
    <button class="row" data-b="${x.b.id}">
      <span class="main"><span class="t1">${esc(x.b.name)}${x.b.me?` <span class="pill me">${tr('me')}</span>`:''}</span></span>
      <span class="pill open">${tr('x_open', eur(x.off))}</span>
    </button>`).join('')}</div></section>`;
  openSheet(tr('sh_payout_pick'), body, {onMount(root){
    root.querySelectorAll('[data-b]').forEach(b=> b.onclick = ()=> sheetWithdraw(b.dataset.b));
  }});
}

/* Ein Betrag, der auf den angezeigten Tag als ausgezahlt gebucht wird.
   Kein Aufteilen mehr - offen ist ein laufender Saldo. */
function sheetWithdraw(bId){
  const offen = salOpen(bId);
  const amt = makeAmount(0);
  const chips = [5000, 10000, Math.round(offen/2/500)*500].filter(c=> c>0 && c<offen);
  const body = `
    <div class="hintline" style="text-align:center;margin-bottom:2px">${tr('open_is', eur(offen))}</div>
    <div class="amt-display" id="ad">${amt.display()}</div>
    <div class="quick">
      ${chips.map(c=>`<button data-q="${c}">${eurShort(c)}</button>`).join('')}
      <button data-q="${offen}">${tr('all_open')} ${eurShort(offen)}</button>
    </div>
    ${padHTML()}
    <p class="hintline" style="margin:12px 2px 0;text-align:center">${tr('withdraw_day', dateShort(ui.date))}</p>
    <button class="btn primary block" data-save style="margin-top:10px">${tr('save')}</button>`;
  openSheet(tr('sh_withdraw', bname(bId)), body, {onMount(root){
    const ad = root.querySelector('#ad');
    const sync = ()=> ad.innerHTML = amt.display();
    root.querySelectorAll('[data-k]').forEach(b=> b.onclick = ()=>{ amt.press(b.dataset.k); sync(); buzz(6); });
    root.querySelectorAll('[data-q]').forEach(b=> b.onclick = ()=>{ amt.set(+b.dataset.q); sync(); buzz(6); });
    root.querySelector('[data-save]').onclick = ()=>{
      if(amt.cents <= 0){ toast(tr('t_enter_amount')); return; }
      if(amt.cents > offen){ toast(tr('max_is_open', eur(offen))); buzz(14); return; }
      const rec = salEntry(bId, ui.date, true);
      rec.pd += amt.cents;
      save(); closeSheet(); render(); buzz(14);
      const rest = salOpen(bId);
      toast(rest ? tr('t_withdrawn', eur(amt.cents), eur(rest)) : tr('t_withdrawn_all', eur(amt.cents)));
    };
  }});
}

  }});

/* ---------- Export / Reset ---------- */
function csvEsc(s){ s = String(s==null?'':s); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV(range){
  return inGerman(()=> exportCSVde(range));
}
function exportCSVde(range){
  const rows = [['Typ','Datum','Zeit','Friseur','Betrag','Zahlart','Kategorie','Status','Notiz']];
  const inR = d => !range || inRange(d, range);
  S.entries.filter(e=>inR(e.d)).sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t))
    .forEach(e=> rows.push(['Umsatz',e.d,e.t,bname(e.b),(e.a/100).toFixed(2).replace('.',','),e.p==='bar'?'Bar':'Karte','','',e.n||'']));
  S.expenses.filter(x=>inR(x.d)).sort((a,b)=>a.d.localeCompare(b.d))
    .forEach(x=> rows.push(['Ausgabe',x.d,'','','-'+(x.a/100).toFixed(2).replace('.',','),'',x.c,'',x.n||'']));
  S.payouts.filter(p=>inR(p.d)).sort((a,b)=>a.d.localeCompare(b.d))
    .forEach(p=>{
      if(p.a)  rows.push(['Gehalt verdient',   p.d,'',bname(p.b),(p.a /100).toFixed(2).replace('.',','),'','','','']);
      if(p.pd) rows.push(['Gehalt ausgezahlt', p.d,'',bname(p.b),(p.pd/100).toFixed(2).replace('.',','),'','','','']);
    });
  const csv = rows.map(r=>r.map(csvEsc).join(';')).join('\r\n');
  const name = range ? `salon-${range[0]}_bis_${range[1]}.csv` : 'salon-alle-daten.csv';
  sheetText(tr('csv_title'), name, csv, tr('csv_hint', rows.length-1));
}

        </div>`).join('');
      box.querySelectorAll('[data-ci]').forEach(inp=> inp.oninput = ()=> cols[+inp.dataset.ci].name = inp.value);
      box.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{ cols.splice(+b.dataset.rm,1); draw(); });

    draw();

      const keep = new Set();
      cols.forEach(c=>{

        else { const id = uid(); S.barbers.push({id, name:n, me:false}); keep.add(id); }
      });
      S.barbers = S.barbers.filter(b=> b.me || keep.has(b.id) || S.entries.some(e=>e.b===b.id));
      S.settings.onboarded = true;
      save(); closeSheet(); render();
      toast(first?tr('t_setup_done'):tr('t_saved'));

function restoreBackup(onCancel){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.style.cssText='position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(inp);
  inp.oncancel = ()=>{ inp.remove(); if(onCancel) onCancel(); };
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; inp.remove();
    if(!f){ if(onCancel) onCancel(); return; }
    const rd = new FileReader();
    rd.onload = ()=>{
      let data;
      try{ data = JSON.parse(rd.result); }catch(e){ toast(tr('t_not_readable')); if(onCancel) onCancel(); return; }
      if(!data || !Array.isArray(data.barbers) || !Array.isArray(data.entries)){ toast(tr('t_invalid_backup')); if(onCancel) onCancel(); return; }
      openSheet(tr('sh_restore_q'), `<p class="hintline">${tr('restore_txt', data.entries.length, (data.expenses||[]).length, (data.payouts||[]).length)}</p>
        <button class="btn primary block" data-yes style="margin-top:14px">${tr('restore_now')}</button>
        <button class="btn ghost block" data-no style="margin-top:10px">${tr('cancel')}</button>`,
        {onMount(r){
          r.querySelector('[data-yes]').onclick = ()=>{
            S = migrate(Object.assign(defaultState(), data));
            S.settings = Object.assign({shop:'', onboarded:true}, data.settings||{});
            LANG = LANGS[S.settings.lang] ? S.settings.lang : LANG;
            save(); closeSheet(); ui.date=todayISO(); ui.anchor=todayISO(); applyLang(); render(); toast(tr('t_restored'));
          };
          r.querySelector('[data-no]').onclick = ()=>{ closeSheet(); if(onCancel) onCancel(); };
        }});
    };
    rd.readAsText(f);
  };
  inp.click();
}

function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller) offerUpdate(reg);
      });
    });
  }).catch(()=>{});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return; reloading = true; location.reload();
  });
}
function offerUpdate(reg){
  openSheet(tr('sh_update'), `<p class="hintline">${tr('update_txt')}</p>
    <button class="btn primary block" data-up style="margin-top:14px">${tr('update_now')}</button>
    <button class="btn ghost block" data-later style="margin-top:10px">${tr('later')}</button>`,
    {onMount(r){
      r.querySelector('[data-up]').onclick = ()=>{ if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); closeSheet(); };
      r.querySelector('[data-later]').onclick = ()=> closeSheet();
    }});
}

/* ============================================================
   PDF-Export – eigener kleiner PDF-Schreiber
   Keine fremde Bibliothek, damit der Export auch offline geht.
   Standardschrift Helvetica mit WinAnsi-Kodierung (Umlaute + €).
   ============================================================ */
const PDF_W = 595.28, PDF_H = 841.89;
const WIN_MAP = {'€':128,'‚':130,'„':132,'…':133,'†':134,'‡':135,'‰':137,'‹':139,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153,'›':155};
function winAnsi(s){
  let out = '';
  for(const ch of String(s == null ? '' : s)){
    const c = ch.charCodeAt(0);
    if(WIN_MAP[ch] !== undefined) out += String.fromCharCode(WIN_MAP[ch]);
    else if(ch.length === 1 && c <= 255) out += ch;
    /* Zeichen, die die PDF-Schrift nicht kennt (Emoji, arabische Schrift),
       werden weggelassen statt durch ein Fragezeichen ersetzt. */
  }
  return out;
}
const HW = '278 278 355 556 556 889 667 191 333 333 389 584 278 333 278 278 556 556 556 556 556 556 556 556 556 556 278 278 584 584 584 556 1015 667 667 722 722 667 611 778 722 278 500 667 556 833 722 778 667 778 722 667 611 722 667 944 667 667 611 278 278 278 469 556 333 556 556 500 556 556 278 556 556 222 222 500 222 833 556 556 556 556 333 500 278 556 500 722 500 500 500 334 260 334 584'.split(' ').map(Number);
const HB = '278 333 474 556 556 889 722 238 333 333 389 584 278 333 278 278 556 556 556 556 556 556 556 556 556 556 333 333 584 584 584 611 975 722 722 722 722 667 611 778 722 278 556 722 611 833 722 778 667 778 722 667 611 722 667 944 667 667 611 333 278 333 584 556 333 556 611 556 611 556 333 611 611 278 278 556 278 889 611 611 611 611 389 556 333 611 556 778 556 556 500 389 280 389 584'.split(' ').map(Number);
function textWidth(s, size, bold){
  const tab = bold ? HB : HW;
  const str = winAnsi(s);
  let w = 0;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    w += (c >= 32 && c <= 126) ? tab[c-32] : 556;
  }
  return w * size / 1000;
}
function pdfStr(s){ return winAnsi(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }

function PDF(){
  const pages = [];
  let cur = null;
  const api = {
    page(){ cur = []; pages.push(cur); return api; },
    text(x, y, s, o){
      o = o || {};
      const size = o.size || 10, bold = !!o.bold, col = o.color || [0,0,0];
      let px = x;
      if(o.align === 'right')       px = x - textWidth(s, size, bold);
      else if(o.align === 'center') px = x - textWidth(s, size, bold)/2;
      cur.push('BT /F' + (bold?2:1) + ' ' + size + ' Tf ' + col[0] + ' ' + col[1] + ' ' + col[2] + ' rg ' +
               px.toFixed(2) + ' ' + (PDF_H - y).toFixed(2) + ' Td (' + pdfStr(s) + ') Tj ET');
      return api;
    },
    line(x1, y1, x2, y2, o){
      o = o || {}; const c = o.color || [0.85,0.87,0.85];
      cur.push(c[0] + ' ' + c[1] + ' ' + c[2] + ' RG ' + (o.w || 0.6) + ' w ' +
               x1.toFixed(2) + ' ' + (PDF_H-y1).toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + (PDF_H-y2).toFixed(2) + ' l S');
      return api;
    },
    rect(x, y, w, h, o){
      o = o || {}; const c = o.fill || [0.94,0.95,0.94];
      cur.push(c[0] + ' ' + c[1] + ' ' + c[2] + ' rg ' +
               x.toFixed(2) + ' ' + (PDF_H-y-h).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re f');
      return api;
    },
    build(title){
      const n = pages.length;
      const objs = [];
      const kids = [];
      for(let i=0;i<n;i++) kids.push((6 + 2*i) + ' 0 R');
      objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[1] = '<< /Type /Pages /Count ' + n + ' /Kids [' + kids.join(' ') + '] >>';
      objs[2] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      for(let i=0;i<n;i++){
        const stream = pages[i].join('\n');
        objs[4 + 2*i] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
        objs[5 + 2*i] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PDF_W.toFixed(2) + ' ' + PDF_H.toFixed(2) +
                        '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (5 + 2*i) + ' 0 R >>';
      }
      let out = '%PDF-1.4\n%âãÏÓ\n';
      const offs = [];
      objs.forEach((o,i)=>{ offs.push(out.length); out += (i+1) + ' 0 obj\n' + o + '\nendobj\n'; });
      const xref = out.length;
      out += 'xref\n0 ' + (objs.length+1) + '\n0000000000 65535 f \n';
      offs.forEach(o=>{ out += ('0000000000' + o).slice(-10) + ' 00000 n \n'; });
      out += 'trailer\n<< /Size ' + (objs.length+1) + ' /Root 1 0 R /Info << /Title (' + pdfStr(title) +
             ') /Producer (Salon Kasse) >> >>\nstartxref\n' + xref + '\n%%EOF';
      const bytes = new Uint8Array(out.length);
      for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return bytes;
    }
  };
  return api;
}

/* ---------- der eigentliche Bericht ---------- */
/* Name fürs PDF: erst die nicht darstellbaren Zeichen entfernen, dann trimmen.
   Bleibt nichts übrig, springt der Standardname ein. */
function salonName(){
  const n = winAnsi(S.settings.shop || '').replace(/\s+/g, ' ').trim();
  return n || 'Salon Kasse';
}

function buildReport(range, label, detailed){
  const r   = range || ['0000-01-01','9999-12-31'];
  const ent = S.entries.filter(e=>inRange(e.d,r)).sort((a,b)=> a.d.localeCompare(b.d) || a.t.localeCompare(b.t));
  const exp = S.expenses.filter(x=>inRange(x.d,r)).sort((a,b)=> a.d.localeCompare(b.d));
  const pay = S.payouts.filter(p=>inRange(p.d,r)).sort((a,b)=> a.d.localeCompare(b.d));
  const T   = totals(ent);
  const expSum = sum(exp, x=>x.a);
  const paidSum = sum(pay, p=>p.pd);
  const earnSum = sum(pay, p=>p.a);

  const M = 46, R = PDF_W - M;
  const BRASS = [0.54,0.38,0.09], MUTED = [0.44,0.49,0.47], LIGHT = [0.62,0.66,0.64];
  const RED = [0.70,0.16,0.11], RED_BG = [0.98,0.91,0.89];
  const doc = PDF();
  let y = 0, page = 0;
  let cont = null;   // Tabellenkopf, der auf Folgeseiten wiederholt wird

  function footer(){
    doc.line(M, PDF_H-48, R, PDF_H-48);
    doc.text(M, PDF_H-36, salonName() + ' – Kassenbericht', {size:8, color:LIGHT});
    doc.text(R, PDF_H-36, 'Seite ' + page, {size:8, align:'right', color:LIGHT});
  }
  function header(){
    if(page) footer();
    page++; doc.page(); y = M + 4;
    doc.text(M, y, salonName(), {size:17, bold:true});
    doc.text(R, y, 'KASSENBERICHT', {size:9, bold:true, align:'right', color:BRASS});
    y += 15;
    doc.text(M, y, label, {size:10.5, color:MUTED});
    const nw = new Date();
    doc.text(R, y, 'erstellt am ' + pad2(nw.getDate()) + '.' + pad2(nw.getMonth()+1) + '.' + nw.getFullYear(),
             {size:8.5, align:'right', color:LIGHT});
    y += 9;
    doc.line(M, y, R, y, {w:1.2, color:BRASS});
    y += 26;
    if(cont){
      doc.text(M, y, cont.t + ' (FORTSETZUNG)', {size:9, bold:true, color:BRASS});
      y += 6; doc.line(M, y, R, y); y += 15;
      drawRow(cont.c, {bold:true, size:8.5, color:MUTED});
    }
  }
  function need(h){ if(y + h > PDF_H - 66) header(); }
  function h2(t){
    need(46);
    doc.text(M, y, t, {size:9, bold:true, color:BRASS});
    y += 6; doc.line(M, y, R, y); y += 15;
  }
  function drawRow(cells, o){
    o = o || {};
    if(o.fill){ doc.rect(M-8, y-11, R-M+16, o.h || 16, {fill:o.fill}); }
    cells.forEach(c=> doc.text(c[1], y, c[0], {
      size: o.size || 9.5, bold: o.bold || c[3], align: c[2], color: o.color
    }));
    y += o.h || 16;
  }
  function row(cells, o){ need((o && o.h) || 16); drawRow(cells, o); }
  function table(t, c){ h2(t); cont = {t, c}; drawRow(c, {bold:true, size:8.5, color:MUTED}); }
  function endTable(){ cont = null; }
  function note(t){ need(16); doc.text(M, y, t, {size:9.5, color:MUTED}); y += 16; }
  /* Offener Betrag: soll auffallen, ohne die Summenzeilen zu übertönen. */
  function noteOpen(label, cents, gross){
    const h = gross ? 26 : 20, sz = gross ? 12.5 : 10.5;
    need(h + 6);
    doc.rect(M-8, y-(gross?13:10), R-M+16, h, {fill:RED_BG});
    doc.text(M, y, label, {size:sz, bold:true, color:RED});
    doc.text(R, y, eur(cents), {size:sz, bold:true, align:'right', color:RED});
    y += h + 4;
  }

  header();

  /* Kennzahlen */
  doc.rect(M-8, y-16, R-M+16, 66, {fill:[0.945,0.955,0.945]});
  doc.text(M, y, 'UMSATZ GESAMT', {size:8, bold:true, color:MUTED});
  doc.text(M, y+26, eur(T.total), {size:22, bold:true});
  const stat = (x, k, v, sub, align)=>{
    doc.text(x, y, k, {size:8, bold:true, color:MUTED, align});
    doc.text(x, y+18, v, {size:12, bold:true, align});
    if(sub) doc.text(x, y+32, sub, {size:8, color:LIGHT, align});
  };
  stat(M+236, 'BAR',    eur(T.bar),   T.total ? pctPair(T).bar + ' %' : '');
  stat(M+346, 'KARTE',  eur(T.karte), T.total ? pctPair(T).karte + ' %' : '');
  /* rechtsbündig am Seitenrand, sonst läuft "im Schnitt …" aus dem Blatt */
  stat(R, 'KUNDEN', String(T.count), T.count ? 'im Schnitt ' + eur(Math.round(T.total/T.count)) : '', 'right');
  y += 66;

  if(!ent.length && !exp.length && !pay.length){
    note('In diesem Zeitraum wurde nichts erfasst.');
    footer();
    return doc.build('Kassenbericht ' + label);
  }

  /* Umsatz nach Friseur */
  const perB = barbersOf(ent).map(b=>({b, t: totals(ent.filter(e=>e.b===b.id))}))
                        .filter(x=>x.t.count>0)
                        .sort((a,b)=> b.t.total - a.t.total);
  if(perB.length){
    table('UMSATZ NACH FRISEUR',
      [['Friseur',M],['Kunden',M+270,'right'],['Bar',M+360,'right'],['Karte',M+440,'right'],['Umsatz',R,'right']]);
    perB.forEach(x=> row([
      [x.b.name + (x.b.me ? ' (ich)' : ''), M],
      [String(x.t.count), M+270, 'right'],
      [eur(x.t.bar), M+360, 'right'],
      [eur(x.t.karte), M+440, 'right'],
      [eur(x.t.total), R, 'right', true]
    ]));
    row([['Gesamt',M,null,true],[String(T.count),M+270,'right',true],[eur(T.bar),M+360,'right',true],
         [eur(T.karte),M+440,'right',true],[eur(T.total),R,'right',true]],
        {fill:[0.945,0.955,0.945], h:18});
    endTable(); y += 14;
  }

  /* Gehalt */
  const perP = barbersOf(pay.map(p=>({b:p.b}))).map(b=>{
    const g = salOf(b.id, r);
    return { b, verdient:g.verdient, paid:g.ausgezahlt, openAll: salOpen(b.id) };
  }).filter(x=> x.verdient || x.paid || x.openAll);
  if(perP.length){
    table('GEHALT', [['Friseur',M],['Verdient',M+300,'right'],['Ausgezahlt',M+400,'right'],['Offen gesamt',R,'right']]);
    perP.forEach(x=> row([
      [x.b.name + (x.b.me ? ' (ich)' : ''), M],
      [eur(x.verdient), M+300, 'right'],
      [eur(x.paid), M+400, 'right'],
      [eur(x.openAll), R, 'right', true]
    ]));
    row([['Gesamt',M,null,true],[eur(earnSum),M+300,'right',true],
         [eur(paidSum),M+400,'right',true],[eur(salOpenAll()),R,'right',true]],
        {fill:[0.945,0.955,0.945], h:18});
    endTable();
    y += 10;
  }

  /* Ausgaben */
  if(exp.length){
    table('AUSGABEN', [['Datum',M],['Kategorie',M+90],['Notiz',M+210],['Betrag',R,'right']]);
    exp.forEach(x=> row([
      [dateShort(x.d), M],
      [x.c, M+90],
      [(x.n || '').slice(0,40), M+210],
      ['– ' + eur(x.a), R, 'right']
    ]));
    row([['Summe',M,null,true],['– ' + eur(expSum),R,'right',true]], {fill:[0.945,0.955,0.945], h:18});
    endTable(); y += 14;
  }

  /* Ergebnis */
  h2('ERGEBNIS');
  row([['Umsatz', M], [eur(T.total), R, 'right']]);
  row([['Ausgaben', M], ['– ' + eur(expSum), R, 'right']]);
  row([['Gehalt ausgezahlt', M], ['– ' + eur(paidSum), R, 'right']]);
  row([['Verbleibt', M, null, true], [eur(T.total - expSum - paidSum), R, 'right', true]],
      {fill:[0.945,0.955,0.945], h:19, size:10.5});
  const offenAlle = salOpenAll();
  if(offenAlle) noteOpen('Offen über alle Zeiträume hinweg', offenAlle, true);
  y += 12;

  /* Tagesübersicht */
  const byDay = {};
  ent.forEach(e=>{ (byDay[e.d] = byDay[e.d] || []).push(e); });
  const days = Object.keys(byDay).sort();
  if(days.length > 1){
    table('NACH TAGEN',
      [['Tag',M],['Kunden',M+270,'right'],['Bar',M+360,'right'],['Karte',M+440,'right'],['Umsatz',R,'right']]);
    days.forEach(d=>{
      const t = totals(byDay[d]);
      row([[dateShort(d), M], [String(t.count), M+270,'right'], [eur(t.bar), M+360,'right'],
           [eur(t.karte), M+440,'right'], [eur(t.total), R,'right']]);
    });
    endTable(); y += 14;
  }

  /* Einzelbuchungen */
  if(detailed && ent.length){
    header();
    table('EINZELBUCHUNGEN',
      [['Datum',M],['Zeit',M+78],['Friseur',M+126],['Notiz',M+226],['Zahlart',M+400],['Betrag',R,'right']]);
    ent.forEach(e=> row([
      [dateShort(e.d), M],
      [e.t, M+78],
      [bname(e.b).slice(0,14), M+126],
      [(e.n || 'Kunde').slice(0,28), M+226],
      [e.p === 'bar' ? 'Bar' : 'Karte', M+400],
      [eur(e.a), R, 'right']
    ], {h:14, size:9}));
    row([['Summe – ' + ent.length + ' Buchungen', M, null, true], [eur(T.total), R, 'right', true]],
        {fill:[0.945,0.955,0.945], h:18});
    endTable();
  }

  footer();
  return doc.build('Kassenbericht ' + label);
}

function rangeLabelDE(range){
  return inGerman(()=>{
    if(!range) return 'Alle Daten';
    if(range[0] === range[1]) return dateLabel(range[0]);
    const a = fromISO(range[0]), b = fromISO(range[1]);
    const lastOfMonth = new Date(b.getFullYear(), b.getMonth()+1, 0).getDate();
    if(a.getDate()===1 && a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear() && b.getDate()===lastOfMonth)
      return CAL.de.mon[a.getMonth()] + ' ' + a.getFullYear();
    if(a.getMonth()===0 && a.getDate()===1 && b.getMonth()===11 && b.getDate()===31 && a.getFullYear()===b.getFullYear())
      return 'Jahr ' + a.getFullYear();
    return dateShort(range[0]) + ' – ' + dateShort(range[1]) + ' ' + b.getFullYear();
  });
}

function downloadBytes(name, bytes, mime){
  try{
    const blob = new Blob([bytes], {type: mime});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 4000);
    toast(tr('t_file_dl', name));
    return true;
  }catch(e){ toast(tr('t_no_save')); return false; }
}

function exportPDF(range, detailed){
  const label = rangeLabelDE(range);
  const bytes = inGerman(()=> buildReport(range, label, detailed));
  const slug = (label || 'gesamt').replace(/[^0-9A-Za-zÄÖÜäöü]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
  downloadBytes('kassenbericht-' + slug + '.pdf', bytes, 'application/pdf');
}

function sheetExport(range, label){
  let ber = range;
  const body = `
    <div class="bchips" style="margin:-2px 0 16px">
      <button class="bchip" data-r="p" aria-pressed="true">${esc(label)}</button>
      <button class="bchip" data-r="a" aria-pressed="false">${tr('x_all_data')}</button>
    </div>
    <button class="btn primary block" data-pdf>${tr('pdf_report')}</button>
    <p class="hintline" style="margin:7px 2px 14px">${tr('pdf_report_sub')}</p>
    <button class="btn block" data-pdfall>${tr('pdf_all')}</button>
    <p class="hintline" style="margin:7px 2px 14px">${tr('pdf_all_sub')}</p>
    <button class="btn block" data-csv2>${tr('csv_excel')}</button>
    ${EMBEDDED ? `<p class="hintline" style="margin:14px 0 0;text-align:center">${tr('embed_note')}</p>` : ''}`;
  openSheet(tr('sh_export'), body, {onMount(root){
    root.querySelectorAll('[data-r]').forEach(b=> b.onclick = ()=>{
      ber = b.dataset.r==='a' ? null : range;
      root.querySelectorAll('[data-r]').forEach(x=> x.setAttribute('aria-pressed', x===b));
      buzz();
    });
    root.querySelector('[data-pdf]').onclick    = ()=>{ closeSheet(); exportPDF(ber, false); };
    root.querySelector('[data-pdfall]').onclick = ()=>{ closeSheet(); exportPDF(ber, true); };
    root.querySelector('[data-csv2]').onclick   = ()=>{ closeSheet(); exportCSV(ber); };
  }});
}
